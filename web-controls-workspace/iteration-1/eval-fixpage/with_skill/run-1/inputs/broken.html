<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山晨民宿 · 精选房型</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #faf8f5; color: #333; }

  /* 顶部导航：fixed + 半透明 */
  nav { position: fixed; top: 0; left: 0; right: 0; height: 64px;
        background: rgba(255,255,255,0.55); backdrop-filter: blur(4px);
        display: flex; align-items: center; padding: 0 40px; z-index: 10; }
  nav .logo { font-weight: 700; margin-right: 40px; }
  nav a { margin-right: 24px; text-decoration: none; color: #444; }

  /* 首屏：直接从页面顶部开始（没有为 fixed 导航留空间） */
  .hero { position: relative; }
  .hero img { display: block; width: 100%; height: 380px; }

  .content { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .content .lead { margin: 0 0 16px; }

  section { padding: 48px 0; }
  h2 { font-size: 22px; }

  .rooms { display: flex; gap: 24px; }
  .room { background: #fff; border-radius: 12px; padding: 16px; width: 300px; }
  .room .pic { height: 220px; border-radius: 8px; overflow: hidden; background: #eee; }
  .room .pic img { width: 100%; height: 100%; object-fit: contain; }
  .room .price { font-size: 26px; font-weight: 700; }
  .room .unit { font-size: 13px; color: #888; }
  .room .desc { font-size: 14px; color: #666; line-height: 1.6; }

  .old-copy { /* 从旧模板复制来的样式，残留了多余的 margin */
    margin-left: 40px; margin-top: 24px;
  }
  footer { text-align: center; padding: 32px 0; color: #999; }
</style>
</head>
<body>
  <nav>
    <span class="logo">山晨民宿</span>
    <a href="#">房型</a><a href="#">体验</a><a href="#">预订</a>
  </nav>

  <div class="hero">
    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1200" alt="民宿外观">
  </div>

  <div class="content">
    <div class="old-copy">
      <section>
        <h2>为什么选山晨</h2>
        <p class="lead">推窗见山，晨起听林。海拔 900 米的独立院落，全年只有 6 间房，为一小部分人保留山中清晨。</p>
        <p>山晨民宿藏于莫干山北麓，四面环林。我们相信：安静是这个时代最贵的享受。</p>
      </section>

      <section>
        <h2>精选房型</h2>
        <div class="rooms">
          <div class="room">
            <div class="pic"><img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800" alt="山景大床房"></div>
            <div><span class="price">¥128</span> <span class="unit">/ 晚起</span></div>
            <p class="desc">山景大床房 · 32㎡ · 独立浴缸</p>
          </div>
          <div class="room">
            <div class="pic"><img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800" alt="庭院套房"></div>
            <div><span class="price">¥256</span> <span class="unit">/ 晚起</span></div>
            <p class="desc">庭院套房 · 55㎡ · 私汤温泉</p>
          </div>
          <div class="room">
            <div class="pic"><img src="https://images.unsplash.com/photo-1554995207-c18c203602cb?w=800" alt=" Marion 树屋"></div>
            <div><span class="price">¥388</span> <span class="unit">/ 晚起</span></div>
            <p class="desc">观星树屋 · 40㎡ · 全景天窗</p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <footer>© 2026 山晨民宿 · 浙ICP备000000号</footer>
</body>
</html>
