<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青屿 · 陶瓷蓝牙音箱 — 商品图片展示区</title>
<style>
  :root{
    --paper:#efe9de;
    --card:#faf7f1;
    --ink:#2e2921;
    --muted:#8d8274;
    --line:#e3dbcc;
    --accent:#43564b;
    --brass:#b6904e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 500px at 50% -100px, rgba(255,255,255,.55), rgba(255,255,255,0)),
      var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden}

  .demo-head{
    max-width:1180px;margin:0 auto;padding:30px 30px 4px;
    font-size:13px;letter-spacing:.22em;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;
  }
  .demo-head span{font-family:Georgia,"Songti SC",SimSun,serif}

  .zone{
    max-width:1180px;margin:14px auto 40px;background:var(--card);
    border:1px solid var(--line);border-radius:22px;
    box-shadow:0 28px 70px -34px rgba(84,68,44,.28);
    padding:34px;
    display:grid;grid-template-columns:88px minmax(0,1fr) 320px;gap:32px;align-items:start;
  }

  /* ---------- 缩略图轨道（指示器：缩略图，非圆点） ---------- */
  .rail{display:flex;flex-direction:column;gap:12px}
  .thumb{
    width:82px;height:82px;border-radius:14px;border:1px solid var(--line);
    padding:0;cursor:pointer;background:#f2ede3;overflow:hidden;position:relative;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .thumb svg{width:100%;height:100%;display:block}
  .thumb:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(84,68,44,.45)}
  .thumb:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .thumb[aria-selected="true"]{
    border-color:transparent;
    box-shadow:0 0 0 2px var(--brass);
    transform:translateY(-2px);
  }
  .thumb .spin-mini{position:absolute;right:4px;bottom:4px;background:rgba(46,41,33,.66);
    color:#f4efe6;font-size:10px;padding:2px 6px;border-radius:999px;letter-spacing:.08em}

  /* ---------- 主舞台 ---------- */
  .stage{
    position:relative;width:100%;aspect-ratio:1/1;max-width:680px;
    border-radius:18px;overflow:hidden;border:1px solid var(--line);
    background:#e9e2d4;
  }
  .stage:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
  .view{position:absolute;inset:0;width:100%;height:100%}
  .view-drift{animation:viewIn .5s cubic-bezier(.22,.8,.3,1) both}
  @keyframes viewIn{from{opacity:0;transform:scale(1.018)}to{opacity:1;transform:none}}
  .stage.spin{cursor:grab;touch-action:none}
  .stage.spin.dragging{cursor:grabbing}

  .hud{position:absolute;inset:0;pointer-events:none}
  .cap{
    position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:8px;
    background:rgba(250,247,241,.85);backdrop-filter:blur(8px);
    border:1px solid rgba(227,219,204,.9);
    padding:8px 13px;border-radius:999px;font-size:12.5px;color:var(--ink);
  }
  .cap .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);flex:none}
  .cap b{font-weight:600}
  .cap i{font-style:normal;color:var(--muted)}
  .hud-right{position:absolute;top:12px;right:12px;display:flex;gap:8px;pointer-events:auto}
  .icon-btn{
    width:44px;height:44px;border-radius:12px;cursor:pointer;
    background:rgba(250,247,241,.88);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--ink);
    backdrop-filter:blur(8px);transition:background .2s, transform .2s;
  }
  .icon-btn:hover{background:#fff;transform:translateY(-1px)}
  .icon-btn:active{transform:none}
  .icon-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .chip-btn{
    height:44px;padding:0 16px;border-radius:12px;cursor:pointer;font-size:13px;
    background:rgba(250,247,241,.88);border:1px solid var(--line);color:var(--ink);
    backdrop-filter:blur(8px);transition:background .2s;
  }
  .chip-btn:hover{background:#fff}
  .chip-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .hint{
    position:absolute;left:50%;transform:translateX(-50%);bottom:16px;
    background:rgba(46,41,33,.74);color:#f4efe6;
    font-size:12.5px;letter-spacing:.05em;
    padding:9px 16px;border-radius:999px;display:flex;align-items:center;gap:9px;
    pointer-events:none;transition:opacity .6s;
  }
  .hint.gone{opacity:0}
  .hint .ico{display:inline-block;animation:wig 2.6s ease-in-out infinite}
  @keyframes wig{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}

  /* ---------- 侧栏商品信息（演示上下文） ---------- */
  .info{padding-top:4px}
  .kicker{font-size:12px;letter-spacing:.3em;color:var(--brass);margin-bottom:10px}
  .info h1{
    font-family:Georgia,"Songti SC",SimSun,serif;font-size:25px;line-height:1.35;
    margin:0 0 14px;font-weight:600;
  }
  .price{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .price b{font-size:30px;font-weight:650;letter-spacing:.02em}
  .price .tag{font-size:12px;color:var(--accent);border:1px solid var(--accent);
    border-radius:999px;padding:3px 10px;letter-spacing:.1em}
  .desc{font-size:13.5px;line-height:1.8;color:var(--muted);margin:0 0 18px}
  .specs{list-style:none;padding:0;margin:0 0 22px;display:flex;flex-wrap:wrap;gap:8px}
  .specs li{
    font-size:12px;color:var(--ink);background:#f2ede3;border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;
  }
  .cta{display:flex;gap:10px;margin-bottom:18px}
  .btn-solid{
    flex:1;height:50px;border:none;border-radius:12px;cursor:pointer;
    background:var(--accent);color:#f7f3ea;font-size:15px;letter-spacing:.14em;
    transition:background .2s, transform .15s;
  }
  .btn-solid:hover{background:#36473d}
  .btn-solid:active{transform:scale(.985)}
  .btn-solid:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .btn-line{
    width:50px;height:50px;border-radius:12px;cursor:pointer;
    background:transparent;border:1.5px solid var(--ink);color:var(--ink);
    display:grid;place-items:center;transition:background .2s;
  }
  .btn-line:hover{background:#f2ede3}
  .btn-line:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .btn-line.faved svg{fill:var(--accent);stroke:var(--accent)}
  .zone-note{font-size:12px;line-height:1.9;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

  /* ---------- 灯箱 Modal ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:60;
    background:rgba(30,25,18,.78);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:4vmin;
  }
  .lightbox[hidden]{display:none}
  .lb-panel{position:relative}
  .lb-media{
    position:relative;width:min(86vw,660px);height:min(86vw,660px);
    border-radius:16px;overflow:hidden;background:#e9e2d4;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.55);
  }
  .lb-fit{width:100%;height:100%;transform-origin:center center}
  .lb-fit svg,.lb-fit canvas{width:100%;height:100%;display:block}
  .lb-cap{
    position:absolute;left:12px;bottom:12px;z-index:2;
    background:rgba(250,247,241,.85);backdrop-filter:blur(8px);
    border:1px solid rgba(227,219,204,.9);border-radius:999px;
    padding:8px 13px;font-size:12.5px;
  }
  .lb-tip{
    position:absolute;right:12px;bottom:12px;z-index:2;
    background:rgba(46,41,33,.62);color:#f4efe6;border-radius:999px;
    padding:8px 13px;font-size:11.5px;letter-spacing:.05em;
  }
  .lb-close{
    position:absolute;top:-52px;right:-6px;width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);
    color:#f4efe6;cursor:pointer;display:grid;place-items:center;
    transition:background .2s;
  }
  .lb-close:hover{background:rgba(255,255,255,.24)}
  .lb-close:focus-visible{outline:2px solid #d8b879;outline-offset:2px}

  /* ---------- 移动端适配 ---------- */
  @media (max-width:960px){
    .zone{grid-template-columns:1fr;padding:18px;gap:20px;border-radius:18px}
    .info{order:3;}
    .rail{order:2;flex-direction:row;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
    .thumb{flex:none;width:64px;height:64px;border-radius:12px}
    .stage{max-width:none}
    .cap{font-size:11.5px}
  }
  @media (prefers-reduced-motion:reduce){
    .view-drift,.hint .ico{animation:none}
    .lb-fit{transition:none}
  }
</style>
</head>

    </aside>
  </main>

  <!-- 灯箱 Modal：类型=全屏查看 / 触发=放大镜按钮 / 关闭=× 或 Esc 或点背景 / 内容=视图大图 -->

    <div class="lb-panel">
      <div class="lb-media" id="lbMedia">
        <div class="lb-fit" id="lbFit"></div>
        <div class="lb-cap" id="lbCap"></div>
        <div class="lb-tip" id="lbTip"></div>
      </div>
      <button class="lb-close" id="lbClose" aria-label="关闭大图">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
  </div>

      if(ctx.roundRect){ ctx.roundRect(fx - w/2, fy, w, h, h/2); } else { ctx.rect(fx - w/2, fy, w, h); }
      ctx.fill();
      ctx.strokeStyle = "#b6904e"; ctx.lineWidth = Math.max(0.8, S*0.0014); ctx.stroke();
    }else if(f.type==="aux"){
      ctx.fillStyle = "#2b2720";
      ctx.beginPath(); ctx.arc(fx, fy, S*0.0075, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#b6904e"; ctx.stroke();
    }else{
      ctx.fillStyle = "#e8e1d3";
      ctx.beginPath(); ctx.arc(fx, fy, S*0.0105, 0, TAU); ctx.fill();
      ctx.strokeStyle = "rgba(120,108,90,0.6)"; ctx.lineWidth = Math.max(0.8, S*0.0014); ctx.stroke();
    }
  });
  ctx.globalAlpha = 1; ctx.restore();

  /* 固定光源的高光与环境遮蔽 */
  ctx.save(); ctx.clip(bodyP);
  var gsp = ctx.createLinearGradient(cx-r, 0, cx+r, 0);
  gsp.addColorStop(0, "rgba(255,255,255,0)"); gsp.addColorStop(0.28, "rgba(255,255,255,0.42)");
  gsp.addColorStop(0.45, "rgba(255,255,255,0)"); gsp.addColorStop(0.6, "rgba(255,255,255,0.16)");
  gsp.addColorStop(0.8, "rgba(255,255,255,0)");
  ctx.fillStyle = gsp; ctx.fillRect(cx-r, topY - ry, r*2, bh + ry*2);

  var gao = ctx.createLinearGradient(0, botY - r*0.55, 0, botY + ry);
  gao.addColorStop(0, "rgba(74,62,44,0)"); gao.addColorStop(1, "rgba(74,62,44,0.18)");
  ctx.fillStyle = gao; ctx.fillRect(cx-r, botY - r*0.55, r*2, bh*0.35 + ry);
  ctx.restore();

  /* 轮廓线 */
  ctx.strokeStyle = "rgba(96,84,66,0.32)"; ctx.lineWidth = S*0.002; ctx.stroke(bodyP);
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = S*0.0014;
  ctx.beginPath(); ctx.ellipse(cx, topY, r, ry, 0, 0, TAU); ctx.stroke();
}

/* 拖动 / 惯性 / 怠速自转 */
function bindSpin(el){
  if(el.dataset.spinBound) return;
  el.dataset.spinBound = "1";
  el.addEventListener("pointerdown", function(e){
    if(e.target.closest && e.target.closest("button")) return;
    dragging = true; recenterTarget = null; omega = 0;
    lastX = e.clientX; accD = 0; accT = performance.now();
    mark(); stage.classList.add("dragging");
    var hint = $("spinHint"); if(hint) hint.classList.add("gone");
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var now = performance.now();
    var d = (e.clientX - lastX) * 0.014;
    theta += d; lastX = e.clientX; mark();
    accD += d;
    var dt = (now - accT)/1000;
    if(dt > 0.08){
      var inst = accD/dt;
      omega = omega*0.25 + inst*0.75;
      accD = 0; accT = now;
    }
  });
  function end(){ if(!dragging) return; dragging = false; stage.classList.remove("dragging"); mark(); }
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("lostpointercapture", end);
}

/* 主循环 */
var pt = performance.now();
function loop(t){
  var dt = Math.min(0.05, (t - pt)/1000); pt = t;
  var spinOn = VIEWS[cur].type === "spin" || !!$("lbSpin");
  if(spinOn && !dragging && !rm){
    if(recenterTarget !== null){
      var d = recenterTarget - theta;
      theta += d*Math.min(1, dt*7);
      if(Math.abs(d) < 0.003 && !dragging){ theta = recenterTarget; recenterTarget = null; omega = 0; }
    }else if(t - lastInter > 2400){
      omega += (0.28 - omega)*Math.min(1, dt*1.1);
      theta += omega*dt;
    }else{
      theta += omega*dt;
      omega *= Math.exp(-2.4*dt);
      if(Math.abs(omega) < 0.004) omega = 0;
    }
  }
  if(spinOn){
    liveCanvases().forEach(function(c){
      var dpr = sizeCanvas(c);
      var ctx = c.getContext("2d");
      drawFrame(ctx, c.width, c.height, theta);
    });
  }
  requestAnimationFrame(loop);
}

/* ============================================================
   6. 灯箱 Modal（类型/触发/关闭/内容 四要素）
============================================================ */
var lb = $("lightbox"), lbFit = $("lbFit"), lbCap = $("lbCap"), lbTip = $("lbTip");
var zoomS = 1, panX = 0, panY = 0, lbFrom = null, lbCur = -1;

function applyZoom(){
  lbFit.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoomS + ")";
}
function zoomReset(){ zoomS = 1; panX = 0; panY = 0; applyZoom(); }

function openLightbox(i){
  lbCur = i; lbFrom = document.activeElement;
  var v = VIEWS[i];
  zoomReset();
  lbTip.textContent = v.type==="spin" ? "松手后缓慢自转 · Esc 关闭" : "滚轮缩放 · 拖动平移 · 双击复位 · Esc 关闭";
  lbCap.innerHTML = "<b>" + v.name + "</b> · " + v.sub;
  if(v.type==="spin"){
    lbFit.innerHTML = "";
    var c = document.createElement("canvas");
    c.id = "lbSpin"; c.style.touchAction = "none";
    lbFit.appendChild(c);
    bindSpin(c);
  }else{
    lbFit.innerHTML = ART[v.art];
  }
  lb.hidden = false;
  document.body.classList.add("locked");
  $("lbClose").focus();
}

function closeLightbox(){
  lb.hidden = true;
  document.body.classList.remove("locked");
  lbFit.innerHTML = "";
  lbCur = -1; zoomReset();
  if(lbFrom && lbFrom.focus) lbFrom.focus();
}

$("lbClose").addEventListener("click", closeLightbox);
lb.addEventListener("pointerdown", function(e){ if(e.target===lb) closeLightbox(); });
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && !lb.hidden) closeLightbox();
  if(e.key==="Tab" && !lb.hidden){ e.preventDefault(); $("lbClose").focus(); }
});

/* 静态大图：滚轮缩放 + 拖动平移 */
lbFit.addEventListener("wheel", function(e){
  if(lbCur < 0 || VIEWS[lbCur].type==="spin") return;
  e.preventDefault();
  zoomS = Math.max(1, Math.min(5, zoomS * (e.deltaY < 0 ? 1.12 : 0.89)));
  if(zoomS === 1){ panX = 0; panY = 0; }
  applyZoom();
}, { passive:false });
lbFit.addEventListener("dblclick", function(){ zoomReset(); });
(function(){
  var pan = false, sx = 0, sy = 0;
  function panLimit(){ return ($("lbMedia").clientWidth * (zoomS-1))/2; }
  lbFit.addEventListener("pointerdown", function(e){
    if(lbCur < 0 || VIEWS[lbCur].type==="spin" || zoomS<=1) return;
    pan = true; sx = e.clientX - panX; sy = e.clientY - panY;
    try{ lbFit.setPointerCapture(e.pointerId); }catch(err){}
  });
  lbFit.addEventListener("pointermove", function(e){
    if(!pan) return;
    var m = panLimit();
    panX = Math.max(-m, Math.min(m, e.clientX - sx));
    panY = Math.max(-m, Math.min(m, e.clientY - sy));
    applyZoom();
  });
  function stop(){ pan = false; }
  lbFit.addEventListener("pointerup", stop);
  lbFit.addEventListener("pointercancel", stop);
  lbFit.addEventListener("lostpointercapture", stop);
})();

/* ============================================================
   7. 信息区按钮（轻反馈，不做弹窗）
============================================================ */
$("addBtn").addEventListener("click", function(){
  var b = this, t = b.textContent;
  b.textContent = "已加入 ✓"; b.disabled = true;
  setTimeout(function(){ b.textContent = t; b.disabled = false; }, 1500);
});
$("favBtn").addEventListener("click", function(){
  var on = this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed", on ? "false" : "true");
  this.classList.toggle("faved", !on);
});

/* ============================================================
   8. 启动
============================================================ */
buildStage();
requestAnimationFrame(function(t){ pt = t; requestAnimationFrame(loop); });

})();
