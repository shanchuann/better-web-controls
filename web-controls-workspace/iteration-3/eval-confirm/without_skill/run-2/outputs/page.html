<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目管理 - 后台管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #1f2329;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ===== 顶部导航 ===== */
  .topbar {
    background: #fff;
    border-bottom: 1px solid #e5e6eb;
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .logo { font-weight: 600; font-size: 15px; }
  .topbar nav { display: flex; gap: 20px; color: #646a73; }
  .topbar nav span.active { color: #1f2329; font-weight: 500; }

  /* ===== 主体 ===== */
  .main { max-width: 960px; margin: 32px auto; padding: 0 24px; }
  .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .page-head h1 { font-size: 18px; font-weight: 600; }
  .page-head p { color: #646a73; font-size: 13px; }

  .card {
    background: #fff;
    border: 1px solid #e5e6eb;
    border-radius: 8px;
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #f0f1f3; }
  th { font-size: 12px; color: #8f959e; font-weight: 500; background: #fafbfc; }
  tr:last-child td { border-bottom: none; }
  .proj-name { font-weight: 500; }
  .meta { color: #8f959e; font-size: 13px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px;
  }
  .badge.on  { background: #e8f7ee; color: #00874d; }
  .badge.off { background: #f2f3f5; color: #8f959e; }

  /* ===== 按钮 ===== */
  .btn {
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; padding: 6px 14px; font-family: inherit;
    transition: background .15s ease;
  }
  .btn-default { background: #f2f3f5; color: #1f2329; }
  .btn-default:hover { background: #e5e6eb; }
  .btn-danger {
    background: #fff; color: #d83931;
    border: 1px solid #fbaca3;
  }
  .btn-danger:hover { background: #ffece8; border-color: #d83931; }
  .btn-danger-solid { background: #d83931; color: #fff; }
  .btn-danger-solid:hover { background: #b82820; }
  .btn-danger-solid:disabled {
    background: #fbb9b3; color: #fff; cursor: not-allowed;
  }
  .btn-text-danger { background: none; color: #d83931; padding: 4px 8px; }
  .btn-text-danger:hover { text-decoration: underline; }

  /* ===== 遮罩层 ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(31, 35, 41, .5);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .overlay.visible { display: flex; }

  /* ===== 确认弹窗 ===== */
  .dialog {
    background: #fff;
    border-radius: 10px;
    width: 440px;
    max-width: calc(100vw - 32px);
    padding: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
    animation: pop .18s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(.96) translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .dialog-head { display: flex; gap: 12px; align-items: flex-start; }
  .warn-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: #ffece8; color: #d83931;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 18px;
  }
  .dialog h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .dialog .sub { color: #646a73; font-size: 13px; }

  .dialog .detail {
    margin: 14px 0 16px;
    padding: 12px 14px;
    background: #f7f8fa;
    border: 1px solid #eceef1;
    border-radius: 6px;
    font-size: 13px;
  }
  .dialog .detail .proj-name { color: #d83931; }
  .dialog .detail li { margin: 2px 0 2px 18px; color: #4e5460; }

  .dialog label {
    display: block; font-size: 13px; margin-bottom: 6px;
  }
  .dialog label strong { color: #d83931; }
  .dialog input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #dcdfe5;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .dialog input:focus { border-color: #d83931; }
  .dialog input.invalid { border-color: #d83931; }

  .dialog .hint { font-size: 12px; color: #8f959e; margin-top: 6px; min-height: 18px; }
  .dialog .hint.err { color: #d83931; }

  .dialog-foot {
    margin-top: 20px;
    display: flex; justify-content: flex-end; gap: 10px;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-12px);
    background: #1f2329; color: #fff;
    padding: 10px 18px; border-radius: 6px; font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 200;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.danger { background: #d83931; }

  /* 空状态 */
  .empty { text-align: center; color: #8f959e; padding: 48px 0; }
</style>
</head>
<body>

<header class="topbar">
  <span class="logo">后台管理</span>
  <nav>
    <span>工作台</span>
    <span class="active">项目管理</span>
    <span>成员</span>
    <span>设置</span>
  </nav>
</header>

<main class="main">
  <div class="page-head">
    <div>
      <h1>项目管理</h1>
      <p>删除项目会同时删除其下所有任务与文件，且无法恢复，请谨慎操作。</p>
    </div>
  </div>

  <div class="card">
    <table aria-label="项目列表">
      <thead>
        <tr>
          <th style="width:28%">项目名称</th>
          <th>状态</th>
          <th>任务数</th>
          <th>文件数</th>
          <th>最近更新</th>
          <th style="width:14%; text-align:right;">操作</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr>
          <td class="proj-name">官网改版 v2</td>
          <td><span class="badge on">进行中</span></td>
          <td class="meta">32</td>
          <td class="meta">118</td>
          <td class="meta">2 小时前</td>
          <td style="text-align:right;">
            <button class="btn btn-danger" data-delete data-name="官网改版 v2">删除项目</button>
          </td>
        </tr>
        <tr>
          <td class="proj-name">数据看板重构</td>
          <td><span class="badge on">进行中</span></td>
          <td class="meta">18</td>
          <td class="meta">54</td>
          <td class="meta">昨天</td>
          <td style="text-align:right;">
            <button class="btn btn-danger" data-delete data-name="数据看板重构">删除项目</button>
          </td>
        </tr>
        <tr>
          <td class="proj-name">旧版电商站</td>
          <td><span class="badge off">已归档</span></td>
          <td class="meta">156</td>
          <td class="meta">892</td>
          <td class="meta">3 个月前</td>
          <td style="text-align:right;">
            <button class="btn btn-danger" data-delete data-name="旧版电商站">删除项目</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="empty" id="empty" hidden>暂无项目</div>
  </div>
</main>

<!-- 删除确认弹窗 -->
<div class="overlay" id="overlay" role="presentation">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgDesc">
    <div class="dialog-head">
      <div class="warn-icon" aria-hidden="true">!</div>
      <div>
        <h2 id="dlgTitle">确认删除项目？</h2>
        <p class="sub" id="dlgDesc">此操作不可撤销，删除后数据无法找回。</p>
      </div>
    </div>

    <div class="detail">
      即将删除项目 <span class="proj-name" id="dlgProjName">—</span>，该项目的以下内容将被永久清除：
      <ul>
        <li>全部 <strong id="dlgTaskCount">—</strong> 个任务</li>
        <li>全部 <strong id="dlgFileCount">—</strong> 个文件与附件</li>
        <li>项目内所有成员的协作记录</li>
      </ul>
    </div>

    <label for="confirmInput">请输入项目名称 <strong id="typeName">—</strong> 以确认：</label>
    <input id="confirmInput" type="text" autocomplete="off" spellcheck="false" placeholder="输入项目名称">
    <p class="hint" id="hint">输入完成后才能点击"确认删除"。</p>

    <div class="dialog-foot">
      <button class="btn btn-default" id="cancelBtn">取消</button>
      <button class="btn btn-danger-solid" id="confirmBtn" disabled>确认删除</button>
    </div>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var overlay    = document.getElementById('overlay');
  var dialog     = overlay.querySelector('.dialog');
  var confirmLbl = document.getElementById('typeName');
  var projNameEl = document.getElementById('dlgProjName');
  var taskEl     = document.getElementById('dlgTaskCount');
  var fileEl     = document.getElementById('dlgFileCount');
  var input      = document.getElementById('confirmInput');
  var hint       = document.getElementById('hint');
  var confirmBtn = document.getElementById('confirmBtn');
  var cancelBtn  = document.getElementById('cancelBtn');
  var toast      = document.getElementById('toast');
  var tbody      = document.getElementById('tbody');
  var empty      = document.getElementById('empty');

  var currentRow = null;
  var currentName = '';
  var lastFocused = null;
  var busy = false;

  /* ---------- 打开弹窗 ---------- */
  function openDialog(row) {
    currentRow = row;
    currentName = row.dataset.name;

    // 从行内读取数据，填充弹窗细节
    var cells = row.parentElement.querySelectorAll('td');
    projNameEl.textContent = currentName;
    taskEl.textContent = cells[2].textContent;
    fileEl.textContent = cells[3].textContent;
    confirmLbl.textContent = '“' + currentName + '”';

    input.value = '';
    input.classList.remove('invalid');
    hint.className = 'hint';
    hint.textContent = '输入完成后才能点击"确认删除"。';
    confirmBtn.disabled = true;
    confirmBtn.textContent = '确认删除';
    busy = false;

    lastFocused = document.activeElement;
    overlay.classList.add('visible');
    input.focus();
  }

  /* ---------- 关闭弹窗 ---------- */
  function closeDialog() {
    if (busy) return; // 删除进行中不允许关闭
    overlay.classList.remove('visible');
    if (lastFocused) lastFocused.focus();
  }

  /* ---------- 输入校验 ---------- */
  input.addEventListener('input', function () {
    var ok = input.value.trim() === currentName;
    confirmBtn.disabled = !ok;
    if (ok) {
      input.classList.remove('invalid');
      hint.className = 'hint';
      hint.textContent = '已匹配，可以点击"确认删除"。';
    } else if (input.value.trim()) {
      hint.className = 'hint';
      hint.textContent = '名称不一致，请完整输入项目名称。';
    } else {
      hint.className = 'hint';
      hint.textContent = '输入完成后才能点击"确认删除"。';
    }
  });

  /* 回车提交 */
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !confirmBtn.disabled) confirmBtn.click();
  });

  /* ---------- 确认删除 ---------- */
  confirmBtn.addEventListener('click', function () {
    if (confirmBtn.disabled || busy) return;
    busy = true;
    confirmBtn.textContent = '删除中…';
    confirmBtn.disabled = true;

    // 模拟接口删除（1 秒）
    setTimeout(function () {
      overlay.classList.remove('visible');
      var tr = currentRow.parentElement;
      tbody.removeChild(tr);
      if (!tbody.children.length) empty.hidden = false;

      showToast('项目“' + currentName + '”已删除', 'danger');
      if (lastFocused) lastFocused.blur();
      busy = false;
    }, 1000);
  });

  cancelBtn.addEventListener('click', closeDialog);

  /* 点击遮罩关闭（点击弹窗本身不关闭） */
  overlay.addEventListener('mousedown', function (e) {
    if (e.target === overlay) closeDialog();
  });

  /* Esc 关闭 */
  document.addEventListener('keydown', function (e) {
    if (!overlay.classList.contains('visible')) return;
    if (e.key === 'Escape') closeDialog();
    if (e.key === 'Tab') trapFocus(e);
  });

  /* 焦点圈定在弹窗内 */
  function trapFocus(e) {
    var focusables = dialog.querySelectorAll('button, input');
    var first = focusables[0];
    var last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  }

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.className = 'toast';
    }, 2500);
  }

  /* 删除按钮绑定 */
  document.querySelectorAll('[data-delete]').forEach(function (btn) {
    btn.addEventListener('click', function () { openDialog(btn); });
  });
})();
</script>
</body>
</html>
