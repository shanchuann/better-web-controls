<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单管理 · 负责人选择与筛选</title>
<style>
  :root{
    --ink-900:#1f2329; --ink-700:#414956; --ink-500:#70788a; --ink-400:#9aa2b4;
    --line:#e6e8ef; --surface:#f5f6fa; --card:#ffffff;
    --brand:#2f6bff; --brand-weak:#eef3ff;
    --ok:#e8f7ee; --ok-ink:#1a8a4e;
    --warn:#fdf3e2; --warn-ink:#b26a00;
    --info:#eaf2ff; --info-ink:#2f6bff;
    --mute:#f0f1f5; --mute-ink:#70788a;
    --danger-ink:#c73a3a;
    --radius:10px; --shadow:0 10px 30px rgba(31,35,41,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--surface);color:var(--ink-900);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    font-size:14px;line-height:1.55}
  .wrap{max-width:1080px;margin:0 auto;padding:36px 24px 64px}
  .page-head h1{font-size:22px;font-weight:700;letter-spacing:.2px}
  .page-head p{color:var(--ink-500);margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-top:20px;overflow:hidden}

  /* ---- 工具栏：负责人 Select 下拉 ---- */
  .toolbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
    padding:16px 20px;border-bottom:1px solid var(--line)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field-label{font-size:13px;color:var(--ink-700);font-weight:600}
  .field-label b{color:var(--danger-ink);font-weight:600;margin-left:2px}
  .field-help{font-size:12px;color:var(--ink-400)}
  .select{position:relative;width:240px}
  .select-btn{display:flex;align-items:center;gap:10px;
    padding:9px 12px;background:#fff;border:1px solid var(--line);
    border-radius:8px;cursor:pointer;font:inherit;color:var(--ink-900);
    transition:border-color .15s, box-shadow .15s}
  .select-btn:hover{border-color:#c6cdda}
  .select-btn:focus-visible{outline:none;border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(47,107,255,.18)}
  .select.open .select-btn{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.18)}
  .avatar{width:24px;height:24px;border-radius:50%;flex:none;display:flex;
    align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
  .select-btn .label{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:8px}
  .select-btn .placeholder{color:var(--ink-400)}
  .clear-btn{flex:none;display:none;border:none;background:none;cursor:pointer;
    color:var(--ink-400);font-size:14px;line-height:1;padding:2px 4px;border-radius:4px}
  .select.filled .clear-btn{display:inline-block}
  .clear-btn:hover{color:var(--ink-700);background:var(--mute)}
  .caret{flex:none;color:var(--ink-400);font-size:11px;transition:transform .18s}
  .select.open .caret{transform:rotate(180deg)}
  .menu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:100%;
    background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
    padding:6px;opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;
    transition:opacity .14s ease, transform .14s ease}
  .select.open .menu{opacity:1;transform:none;pointer-events:auto}
  .opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;
    cursor:pointer;color:var(--ink-700);position:relative}
  .opt .label{flex:1;min-width:0}
  .opt .label small{display:block;color:var(--ink-400);font-size:12px}
  .opt .count{color:var(--ink-400);font-size:12px;flex:none}
  .opt .check{color:var(--brand);font-weight:700;visibility:hidden;flex:none}
  .opt[aria-selected="true"]{color:var(--ink-900);background:var(--brand-weak)}
  .opt[aria-selected="true"] .check{visibility:visible}
  .opt.hover{background:var(--mute)}
  .opt[aria-selected="true"].hover{background:#e2ebff}
  .opt-count-empty{color:var(--danger-ink)}

  /* ---- 条件标签（筛选状态提示） ---- */
  .filter-chips{display:none;align-items:center;gap:8px;margin-left:auto;align-self:center}
  .filter-chips.show{display:flex}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;
    background:var(--brand-weak);color:var(--brand);border-radius:999px;font-size:12px}
  .chip button{border:none;background:none;cursor:pointer;color:inherit;font-size:11px;
    line-height:1;padding:3px;border-radius:50%}
  .chip button:hover{background:rgba(47,107,255,.15)}
  .chips-hint{color:var(--ink-400);font-size:12px}

  .stats{padding:14px 20px 0;color:var(--ink-500);font-size:13px}
  .stats b{color:var(--ink-900)}

  /* ---- 表格 ---- */
  .table-scroll{overflow-x:auto;margin-top:6px;max-height:70vh;overflow-y:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  thead th{position:sticky;top:0;z-index:2;font-size:12px;font-weight:600;color:var(--ink-500);
    text-align:left;letter-spacing:.4px;background:#fafbfd;padding:10px 20px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:12px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#fafbfd}
  .th-num,.td-num{text-align:right;font-variant-numeric:tabular-nums}
  .order-no{font-weight:600;font-variant-numeric:tabular-nums}
  .cell-dim{color:var(--ink-500);font-size:12px}
  .person{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .person .avatar{width:20px;height:20px;font-size:11px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
  .badge.w{background:var(--warn);color:var(--warn-ink)}
  .badge.i{background:var(--info);color:var(--info-ink)}
  .badge.o{background:var(--ok);color:var(--ok-ink)}
  .badge.x{background:var(--mute);color:var(--mute-ink)}
  .row-actions{white-space:nowrap}
  .row-action{color:var(--brand);font-size:13px;cursor:pointer;padding:6px 8px;border-radius:6px;
    text-decoration:none;display:inline-block}
  .row-action:hover{background:var(--brand-weak)}

  /* ---- 空状态：筛选无果（条件保留、可移除、引导改条件） ---- */
  .empty{display:none;padding:56px 24px;text-align:center}
  .empty .ico{width:56px;height:56px;border-radius:50%;background:var(--mute);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    font-size:24px;color:var(--ink-400)}
  .empty h3{font-size:16px;margin-bottom:6px}
  .empty p{color:var(--ink-500);font-size:13px;margin-bottom:16px}
  .empty .cta{background:var(--brand);color:#fff;border:none;border-radius:8px;
    padding:8px 18px;font-size:13px;cursor:pointer;font-family:inherit}
  .empty .cta:hover{filter:brightness(1.08)}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media (max-width:640px){
    .wrap{padding:20px 12px 40px}
    .filter-chips{margin-left:0}
    thead th,tbody td{padding:10px 12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <h1>订单管理</h1>
    <p>选择负责人查看其名下订单，也可以清空条件查看全部订单。</p>
  </header>

  <section class="card">
    <!-- 工具栏：负责人 Select（单选下拉），选中后按负责人筛选订单 -->
    <div class="toolbar">
      <div class="field">
        <label class="field-label" id="owner-label">负责人<b>*</b></label>
        <div class="select" id="owner-select">
          <div class="select-btn" id="select-btn" role="button" tabindex="0" aria-haspopup="listbox"
               aria-expanded="false" aria-labelledby="owner-label">
            <span class="label placeholder" id="select-text" style="display:flex">选择负责人</span>
            <button type="button" class="clear-btn" id="clear-btn" aria-label="清空筛选条件，查看全部订单">✕</button>
            <span class="caret">▼</span>
          </div>
          <ul class="menu" id="menu" role="listbox" aria-labelledby="owner-label">
            <li class="opt" role="option" data-value="__all__" aria-selected="true">
              <span class="avatar" style="background:#8f9bb3">全</span>
              <span class="label">全部负责人<small>不按负责人筛选</small></span>
              <span class="count" id="count-all"></span>
              <span class="check">✓</span>
            </li>
          </ul>
        </div>
        <span class="field-help">只能选择一个负责人，可点 ✕ 清空后重选</span>
      </div>
      <div class="filter-chips" id="chips">
        <span class="chip"><span id="chip-text">负责人：陈明</span>
          <button id="chip-remove" aria-label="移除负责人筛选条件">✕</button></span>
        <span class="chips-hint">点击 ✕ 移除条件</span>
      </div>
    </div>

    <div class="stats" id="stats" aria-live="polite">共 0 条订单</div>

    <!-- 订单列表：名称贴左，金额等宽数字右对齐 -->
    <div class="table-scroll" id="table-wrap" tabindex="-1">
      <table>
        <thead>
          <tr>
            <th style="width:150px">订单号</th>
            <th style="width:190px">客户 / 商品</th>
            <th style="width:150px">负责人</th>
            <th style="width:92px">状态</th>
            <th class="th-num" style="width:110px">金额</th>
            <th style="width:150px">下单时间</th>
            <th style="width:110px">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <!-- 空状态：筛选无果（当前条件保留，可移除或改选负责人） -->
    <div class="empty" id="empty">
      <div class="ico">🔍</div>
      <h3>没有该负责人的订单</h3>
      <p>当前条件：负责人“<span id="empty-owner"></span>”。可点击上方标签的 ✕ 移除条件，或改选其他负责人。</p>
      <button type="button" class="cta" id="view-all">查看全部订单</button>
    </div>
  </section>
</div>

<div class="sr-only" id="live-msg" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ---------------- 示例数据 ---------------- */
  const OWNERS = [
    { id:"chen", name:"陈明",   role:"华东大区", color:"#2f6bff" },
    { id:"lin",  name:"林月",   role:"华南大区", color:"#1a8a4e" },
    { id:"wang", name:"王子健", role:"华北大区", color:"#b26a00" },
    { id:"su",   name:"苏晴",   role:"西南大区", color:"#7a3fbf" },
    { id:"zhou", name:"周涛",   role:"华东大区", color:"#c73a3a" }
  ];
  const STATUS = {
    waiting:["待处理","w"], doing:["进行中","i"],
    done:["已完成","o"],    cancelled:["已取消","x"]
  };
  /* 周涛名下暂无订单，用于演示"筛选无果"空状态 */
  const ORDERS = [
    { no:"SO-2026-1021", customer:"慧科科技", product:"云端视频转码包（年度）", owner:"chen", status:"doing",     amount:36800, time:"2026-10-30 09:12" },
    { no:"SO-2026-1020", customer:"蓝湾贸易", product:"跨境物流报表模块",       owner:"lin",  status:"waiting",   amount:12800, time:"2026-10-29 17:40" },
    { no:"SO-2026-1019", customer:"启明教育", product:"在线网校部署服务",       owner:"chen", status:"done",      amount:59600, time:"2026-10-28 14:02" },
    { no:"SO-2026-1018", customer:"北岭制造", product:"设备巡检小程序",         owner:"wang", status:"doing",     amount:24300, time:"2026-10-27 11:26" },
    { no:"SO-2026-1017", customer:"星点传媒", product:"投放数据看板标准版",     owner:"su",   status:"waiting",   amount:8600,  time:"2026-10-26 16:55" },
    { no:"SO-2026-1016", customer:"慧科科技", product:"私有化存储扩容 10TB",    owner:"chen", status:"done",      amount:42100, time:"2026-10-25 10:08" },
    { no:"SO-2026-1015", customer:"广济药房", product:"会员积分系统改造",       owner:"wang", status:"cancelled", amount:15200, time:"2026-10-24 15:33" },
    { no:"SO-2026-1014", customer:"蓝湾贸易", product:"订单对账自动化套件",     owner:"lin",  status:"doing",     amount:18900, time:"2026-10-23 09:47" },
    { no:"SO-2026-1013", customer:"启明教育", product:"园区访客通行系统",       owner:"su",   status:"done",      amount:27500, time:"2026-10-22 13:21" },
    { no:"SO-2026-1012", customer:"云山文旅", product:"景区票务小程序",         owner:"wang", status:"waiting",   amount:33200, time:"2026-10-21 18:05" }
  ];

  /* ---------------- DOM 引用 ---------------- */
  const selectEl   = document.getElementById("owner-select");
  const selectBtn  = document.getElementById("select-btn");
  const selectText = document.getElementById("select-text");
  const clearBtn   = document.getElementById("clear-btn");
  const menuEl     = document.getElementById("menu");
  const chips      = document.getElementById("chips");
  const chipText   = document.getElementById("chip-text");
  const chipRemove = document.getElementById("chip-remove");
  const tbody      = document.getElementById("tbody");
  const stats      = document.getElementById("stats");
  const tableWrap  = document.getElementById("table-wrap");
  const empty      = document.getElementById("empty");
  const emptyOwner = document.getElementById("empty-owner");
  const viewAll    = document.getElementById("view-all");
  const liveMsg    = document.getElementById("live-msg");
  const countAll   = document.getElementById("count-all");

  let current  = "__all__"; // 当前选中的负责人
  let open     = false;
  let activeVi = 0;         // 键盘高亮索引

  /* ---------------- 渲染下拉选项（含每人订单数） ---------------- */
  countAll.textContent = ORDERS.length + " 条";
  OWNERS.forEach(o => {
    const n = ORDERS.filter(x => x.owner === o.id).length;
    const li = document.createElement("li");
    li.className = "opt";
    li.setAttribute("role", "option");
    li.setAttribute("data-value", o.id);
    li.innerHTML =
      '<span class="avatar" style="background:' + o.color + '">' + o.name[0] + '</span>' +
      '<span class="label">' + o.name + '<small>' + o.role + '</small></span>' +
      '<span class="count' + (n === 0 ? ' opt-count-empty' : '') + '">' + n + ' 条</span>' +
      '<span class="check">✓</span>';
    menuEl.appendChild(li);
  });

  function ownerOf(id){ return OWNERS.find(o => o.id === id); }

  /* ---------------- Select UI 同步 ---------------- */
  function syncSelectUI(){
    const opts = Array.prototype.slice.call(menuEl.children);
    opts.forEach(li => li.setAttribute("aria-selected", String(li.dataset.value === current)));
    selectText.textContent = "";
    selectText.classList.remove("placeholder");
    if(current !== "__all__"){
      const o = ownerOf(current);
      const av = document.createElement("span");
      av.className = "avatar";
      av.style.background = o.color;
      av.textContent = o.name[0];
      selectText.appendChild(av);
      selectText.appendChild(document.createTextNode(o.name));
      chipText.textContent = "负责人：" + o.name;
      chips.classList.add("show");
      selectEl.classList.add("filled");
    }else{
      selectText.textContent = "选择负责人";
      selectText.classList.add("placeholder");
      chips.classList.remove("show");
      selectEl.classList.remove("filled");
    }
  }

  /* ---------------- 表格渲染 ---------------- */
  function render(){
    const filtered = current === "__all__" ? ORDERS : ORDERS.filter(x => x.owner === current);
    if(current === "__all__"){
      stats.innerHTML = "共 <b>" + filtered.length + "</b> 条订单";
    }else{
      stats.innerHTML = "共 <b>" + filtered.length + "</b> 条订单（负责人：" + ownerOf(current).name + "）";
    }
    tbody.innerHTML = "";
    filtered.forEach(row => {
      const o  = ownerOf(row.owner);
      const st = STATUS[row.status];
      const tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="order-no">' + row.no + '</td>' +
        '<td>' + row.customer + '<div class="cell-dim">' + row.product + '</div></td>' +
        '<td><div class="person"><span class="avatar" style="background:' + o.color + '">' + o.name[0] + '</span>' + o.name + '</div></td>' +
        '<td><span class="badge ' + st[1] + '">' + st[0] + '</span></td>' +
        '<td class="td-num">¥' + row.amount.toLocaleString("zh-CN") + '</td>' +
        '<td class="cell-dim">' + row.time + '</td>' +
        '<td class="row-actions"><a class="row-action" href="javascript:void(0)">查看</a>' +
        '<a class="row-action" href="javascript:void(0)">编辑</a></td>';
      tbody.appendChild(tr);
    });
    const isEmpty = filtered.length === 0;
    if(isEmpty){
      tableWrap.style.display = "none";
      empty.style.display = "block";
      if(current !== "__all__"){ emptyOwner.textContent = ownerOf(current).name; }
    }else{
      empty.style.display = "none";
      tableWrap.style.display = "block";
    }
  }

  function announce(text){ liveMsg.textContent = text; }

  function applyFilter(id, silent){
    current = id;
    syncSelectUI();
    render();
    if(!silent){
      const n = ORDERS.filter(x => x.owner === id).length;
      announce(id === "__all__"
        ? "已显示全部 " + ORDERS.length + " 条订单"
        : "已筛选负责人 " + ownerOf(id).name + "，共 " + n + " 条订单，" + (n === 0 ? "暂无订单" : "右侧行为该负责人的订单"));
    }
  }

  /* ---------------- Select 行为：打开 / 关闭 / 键盘 ---------------- */
  function getOpts(){ return Array.prototype.slice.call(menuEl.children); }

  function openMenu(){
    open = true;
    selectEl.classList.add("open");
    selectBtn.setAttribute("aria-expanded", "true");
    const opts = getOpts();
    activeVi = opts.findIndex(li => li.dataset.value === current);
    if(activeVi < 0) activeVi = 0;
    opts[activeVi].classList.add("hover");
    opts[activeVi].scrollIntoView({ block: "nearest" });
  }

  function closeMenu(){
    open = false;
    selectEl.classList.remove("open");
    selectBtn.setAttribute("aria-expanded", "false");
    menuEl.querySelectorAll(".opt.hover").forEach(li => li.classList.remove("hover"));
  }

  function moveActive(step){
    const opts = getOpts();
    opts[activeVi].classList.remove("hover");
    activeVi = (activeVi + step + opts.length) % opts.length;
    opts[activeVi].classList.add("hover");
    opts[activeVi].scrollIntoView({ block: "nearest" });
  }

  function pick(li){
    closeMenu();
    if(current !== li.dataset.value){
      applyFilter(li.dataset.value);
    }
    selectBtn.focus();
  }

  /* 触发框：点击 / 键盘 */
  function toggle(){ open ? closeMenu() : openMenu(); }
  selectBtn.addEventListener("click", toggle);
  selectBtn.addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){
      e.preventDefault();
      open ? moveActive(1) : openMenu();
    }else if(e.key === "ArrowUp"){
      e.preventDefault();
      open ? moveActive(-1) : openMenu();
    }else if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      toggle();
    }else if(e.key === "Escape"){
      closeMenu();
    }
  });

  /* 选项：点击选取；菜单内键盘 ↑↓ Enter */
  menuEl.addEventListener("click", e => {
    const li = e.target.closest(".opt");
    if(li) pick(li);
  });
  menuEl.addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){ e.preventDefault(); moveActive(1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); moveActive(-1); }
    else if(e.key === "Enter" || e.key === " "){
      e.preventDefault(); pick(getOpts()[activeVi]);
    }
    else if(e.key === "Escape"){ closeMenu(); selectBtn.focus(); }
  });

  /* 点击空白处关闭 */
  document.addEventListener("click", e => {
    if(open && !selectEl.contains(e.target)) closeMenu();
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && open){ closeMenu(); selectBtn.focus(); }
  });

  /* ---------------- 清空条件（✕ / 标签 / 空状态按钮 三处入口） ---------------- */
  function clearFilter(){
    closeMenu();
    applyFilter("__all__");
  }
  clearBtn.addEventListener("click", e => { e.stopPropagation(); clearFilter(); });
  chipRemove.addEventListener("click", clearFilter);
  viewAll.addEventListener("click", clearFilter);

  /* ---------------- 初始渲染 ---------------- */
  applyFilter("__all__", true);
  selectBtn.setAttribute("aria-expanded", "false");
})();
</script>
</body>
</html>
