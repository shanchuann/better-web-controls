<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 云启 CloudNest</title>
<style>
  :root {
    --brand: #D96C47;
    --brand-deep: #B9532F;
    --brand-soft: #F5E0D6;
    --ink: #2B2320;
    --ink-2: #6B5F58;
    --ink-3: #A2968E;
    --line: #E8DED7;
    --bg: #FAF7F4;
    --card: #FFFFFF;
    --ok: #2E8B57;
    --err: #C0392B;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- 左侧品牌区 ---------- */
  .brand {
    flex: 1 1 48%;
    background: linear-gradient(160deg, #E07A52 0%, #C8553D 55%, #9E3F2B 100%);
    color: #FFF6F0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 56px;
    position: relative;
    overflow: hidden;
  }
  .brand::before, .brand::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 246, 240, .28);
  }
  .brand::before { width: 420px; height: 420px; right: -140px; bottom: -160px; }
  .brand::after  { width: 280px; height: 280px; right: 40px; bottom: 60px; border-color: rgba(255,246,240,.18); }
  .brand-logo {
    display: flex; align-items: center; gap: 12px;
    font-size: 19px; font-weight: 700; letter-spacing: 1px;
    position: relative; z-index: 1;
  }
  .brand-logo .mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(255,255,255,.92);
    display: flex; align-items: center; justify-content: center;
    color: var(--brand-deep); font-size: 17px; font-weight: 800;
  }
  .brand-body { position: relative; z-index: 1; max-width: 460px; }
  .brand-body h1 {
    font-size: 34px; line-height: 1.35; font-weight: 700;
    margin-bottom: 18px;
  }
  .brand-body p {
    font-size: 15px; line-height: 1.8; color: rgba(255,246,240,.82);
    margin-bottom: 36px;
  }
  .brand-stats {
    display: flex; gap: 40px;
  }
  .brand-stats .num { font-size: 26px; font-weight: 700; }
  .brand-stats .lbl { font-size: 13px; color: rgba(255,246,240,.72); margin-top: 4px; }
  .brand-foot {
    position: relative; z-index: 1;
    font-size: 13px; color: rgba(255,246,240,.6);
  }

  /* ---------- 右侧表单区 ---------- */
  .panel {
    flex: 1 1 52%;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px;
  }
  .form-wrap { width: 100%; max-width: 400px; }
  .form-head { margin-bottom: 32px; }
  .form-head h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .form-head p { font-size: 14px; color: var(--ink-2); }
  .form-head a { color: var(--brand); text-decoration: none; font-weight: 600; }
  .form-head a:hover { color: var(--brand-deep); text-decoration: underline; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--ink-2); margin-bottom: 7px;
  }
  .input-box {
    position: relative;
    display: flex; align-items: center;
  }
  .input-box input {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  .input-box input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(217,108,71,.15);
  }
  .input-box input::placeholder { color: var(--ink-3); }
  .field.invalid input { border-color: var(--err); }
  .field .has-toggle { padding-right: 46px; }
  .eye-btn {
    position: absolute; right: 6px;
    width: 34px; height: 34px;
    border: none; background: transparent; cursor: pointer;
    border-radius: 8px; color: var(--ink-3);
    display: flex; align-items: center; justify-content: center;
    transition: color .15s, background .15s;
  }
  .eye-btn:hover { color: var(--ink-2); background: var(--bg); }
  .eye-btn svg { width: 18px; height: 18px; }
  .field-msg {
    display: none;
    font-size: 12px; color: var(--err); margin-top: 6px;
  }
  .field.invalid .field-msg { display: block; }

  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 24px;
    font-size: 13px;
  }
  .check { display: flex; align-items: center; gap: 7px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .check input { accent-color: var(--brand); width: 15px; height: 15px; cursor: pointer; }
  .row-between a { color: var(--brand); text-decoration: none; font-weight: 500; }
  .row-between a:hover { color: var(--brand-deep); text-decoration: underline; }

  .btn-primary {
    width: 100%; height: 48px;
    border: none; border-radius: 10px;
    background: var(--brand);
    color: #fff; font-size: 16px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background .18s, transform .12s, box-shadow .18s;
    box-shadow: 0 6px 16px rgba(217,108,71,.28);
  }
  .btn-primary:hover { background: var(--brand-deep); box-shadow: 0 8px 20px rgba(217,108,71,.36); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: .65; cursor: not-allowed; }
  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  .btn-primary.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    display: flex; align-items: center; gap: 14px;
    margin: 26px 0; color: var(--ink-3); font-size: 12px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .social-row { display: flex; gap: 12px; }
  .btn-social {
    flex: 1; height: 44px;
    border: 1.5px solid var(--line);
    background: var(--card); border-radius: 10px;
    font-size: 14px; color: var(--ink-2); font-family: inherit;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: border-color .18s, background .18s, transform .12s;
  }
  .btn-social:hover { border-color: var(--brand); color: var(--brand-deep); background: var(--brand-soft); }
  .btn-social:active { transform: translateY(1px); }
  .btn-social svg { width: 17px; height: 17px; }

  .foot-tip {
    margin-top: 28px; text-align: center; font-size: 13px; color: var(--ink-3);
  }
  .foot-tip a { color: var(--brand); text-decoration: none; font-weight: 600; }
  .foot-tip a:hover { color: var(--brand-deep); text-decoration: underline; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; top: 28px; left: 50%;
    transform: translate(-50%, -16px);
    background: #2B2320; color: #fff;
    padding: 11px 20px; border-radius: 10px;
    font-size: 14px;
    display: flex; align-items: center; gap: 9px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 99;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .toast.error .dot { background: #E74C3C; }

  /* ---------- 响应式 ---------- */
  @media (max-width: 900px) {
    .page { flex-direction: column; }
    .brand { padding: 32px 28px; min-height: 260px; }
    .brand-body h1 { font-size: 24px; }
    .brand-body p { margin-bottom: 20px; }
    .brand-stats { gap: 28px; }
    .brand-foot { display: none; }
    .panel { padding: 40px 24px 56px; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 左侧：品牌展示 -->
  <aside class="brand">
    <div class="brand-logo">
      <span class="mark">CN</span>
      云启工作台
    </div>
    <div class="brand-body">
      <h1>让团队的数据<br>在云端自然生长</h1>
      <p>从数据接入、建模分析到可视化报告，云启为企业提供一站式 SaaS 数据协作平台，助力 3000+ 团队做出更快、更准的决策。</p>
      <div class="brand-stats">
        <div><div class="num">3,000+</div><div class="lbl">企业客户</div></div>
        <div><div class="num">99.95%</div><div class="lbl">服务可用性</div></div>
        <div><div class="num">10 亿+</div><div class="lbl">日均数据处理</div></div>
      </div>
    </div>
    <div class="brand-foot">© 2026 云启科技 · 苏ICP备2026000000号</div>
  </aside>

  <!-- 右侧：登录表单 -->
  <main class="panel">
    <div class="form-wrap">
      <div class="form-head">
        <h2>欢迎回来 👋</h2>
        <p>还没有账号？<a href="#" onclick="return false;">立即注册</a></p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field" id="fieldAccount">
          <label for="account">邮箱 / 手机号</label>
          <div class="input-box">
            <input type="text" id="account" name="account"
                   placeholder="you@company.com" autocomplete="username">
          </div>
          <div class="field-msg" id="accountMsg">请输入正确的邮箱或手机号</div>
        </div>

        <div class="field" id="fieldPwd">
          <label for="password">密码</label>
          <div class="input-box">
            <input type="password" id="password" name="password"
                   class="has-toggle" placeholder="请输入密码"
                   autocomplete="current-password">
            <button type="button" class="eye-btn" id="eyeBtn" aria-label="显示或隐藏密码" title="显示/隐藏密码">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="field-msg" id="pwdMsg">密码至少 6 位</div>
        </div>

        <div class="row-between">
          <label class="check">
            <input type="checkbox" id="remember"> 记住我
          </label>
          <a href="#" onclick="return false;">忘记密码？</a>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submitText">登 录</span>
        </button>
      </form>

      <div class="divider">或使用以下方式登录</div>

      <div class="social-row">
        <button type="button" class="btn-social" onclick="toast('微信扫码登录入口（演示）')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 13.5c.3 0 .5-.2.5-.5s-.2-.5-.5-.5-.5.2-.5.5.2.5.5.5zm4-1c0 .3.2.5.5.5s.5-.2.5-.5-.2-.5-.5-.5-.5.2-.5.5zM9.2 22C4.1 22 0 18.4 0 13.9c0-4.4 4.1-8.1 9.2-8.1s9.2 3.6 9.2 8.1c0 .5 0 1-.2 1.4l-.1.1-.1.2-.2.4-.2.3-.2.3-.2.3-.3.3-.3.3-.3.3-.3.3-.4.3-.3.2-.4.3-.3.2-.4.2-.4.3-.4.2-.4.2-.4.2-.4.2-.5.2-.4.1-.5.1-.5.1-.5.1h-.5l-.5.1h-1zM9.4 6.9c-.3 0-.5.2-.5.6 0 .3.2.5.5.6 3.6.1 6.5 2.3 6.6 5 .3 0 .5.2.5.5s-.2.5-.5.5c-.2 3.2-3.2 5.8-7 5.8h-.4c-.3 0-.5.2-.5.5s.2.5.5.5c4.5 0 8.2-3 8.2-6.7 0-3.9-3.6-6.9-8.1-6.9v-.4zm.3 12.3c1.4-.1 2.7-.6 3.7-1.4 1.1-.9 1.7-2.1 1.7-3.5 0-.2-.2-.4-.4-.4s-.4.2-.4.4c0 2-1.9 3.7-4.4 3.9-.3 0-.5.2-.5.5s.2.5.3.5z" transform="scale(0.85) translate(2 2)"/></svg>
          微信登录
        </button>
        <button type="button" class="btn-social" onclick="toast('企业 SSO 登录入口（演示）')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          企业 SSO
        </button>
      </div>

      <p class="foot-tip">登录即代表同意 <a href="#" onclick="return false;">服务条款</a> 与 <a href="#" onclick="return false;">隐私政策</a></p>
    </div>
  </main>
</div>

<div class="toast" id="toast">
  <span class="dot"></span><span id="toastText">登录成功（演示）</span>
</div>

<script>
(function () {
  var eyeBtn = document.getElementById('eyeBtn');
  var eyeIcon = document.getElementById('eyeIcon');
  var pwd = document.getElementById('password');
  var showing = false;

  var ICON_EYE = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>';
  var ICON_EYE_OFF = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 23 12a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

  eyeBtn.addEventListener('click', function () {
    showing = !showing;
    pwd.type = showing ? 'text' : 'password';
    eyeIcon.innerHTML = showing ? ICON_EYE_OFF : ICON_EYE;
  });

  var fields = {
    account: {
      wrap: document.getElementById('fieldAccount'),
      input: document.getElementById('account'),
      valid: function (v) {
        var email = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        var phone = /^1[3-9]\d{9}$/;
        return email.test(v) || phone.test(v);
      }
    },
    password: {
      wrap: document.getElementById('fieldPwd'),
      input: document.getElementById('password'),
      valid: function (v) { return v.length >= 6; }
    }
  };

  Object.keys(fields).forEach(function (key) {
    var f = fields[key];
    f.input.addEventListener('input', function () {
      f.wrap.classList.remove('invalid');
    });
  });

  var btn = document.getElementById('submitBtn');
  var btnText = document.getElementById('submitText');

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = true, firstBad = null;
    Object.keys(fields).forEach(function (key) {
      var f = fields[key];
      var pass = f.valid(f.input.value.trim());
      f.wrap.classList.toggle('invalid', !pass);
      if (!pass) {
        ok = false;
        if (!firstBad) firstBad = f.input;
      }
    });
    if (!ok) {
      toast('请修正表单中标红的错误', true);
      firstBad.focus();
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    btnText.textContent = '登录中…';

    setTimeout(function () {
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = '登 录';
      var remember = document.getElementById('remember').checked;
      toast(remember ? '登录成功（演示）· 已记住此设备' : '登录成功（演示）');
    }, 1200);
  });
})();

var toastTimer = null;
function toast(msg, isErr) {
  var t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.toggle('error', !!isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
}
</script>
</body>
</html>
