<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 炽薪云 SaaS 管理平台</title>
<style>
  :root {
    --clay-50: #fdf5f0;
    --clay-100: #fae8dc;
    --clay-300: #e8a480;
    --clay-500: #d96c3f;   /* 陶橙 主品牌色 */
    --clay-600: #c25a30;
    --clay-700: #9a4622;
    --clay-900: #3d1e10;
    --ink-900: #1f1611;
    --ink-600: #5c4f47;
    --ink-400: #988c84;
    --line: #ece3dc;
    --bg: #fbf7f3;
    --card: #ffffff;
    --ok: #2f9e6e;
    --err: #d64545;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(61,30,16,.06);
    --shadow-md: 0 12px 32px -12px rgba(61,30,16,.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink-900);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    display: grid;
    grid-template-columns: minmax(420px, 46%) 1fr;
    min-height: 100vh;
  }

  /* ========== 品牌侧 ========== */
  .brand {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 85% -10%, rgba(255,166,110,.35), transparent 55%),
      radial-gradient(90% 70% at 10% 110%, rgba(217,108,63,.45), transparent 60%),
      linear-gradient(160deg, #4a2513 0%, #7c3a1c 45%, #9a4622 100%);
    color: #fff7f0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 60px;
  }

  .brand::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(80% 70% at 70% 20%, #000 0%, transparent 75%);
    pointer-events: none;
  }

  .brand::after {
    content: "";
    position: absolute;
    width: 560px; height: 560px;
    right: -200px; bottom: -220px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,183,127,.5), rgba(217,108,63,.08) 70%);
    filter: blur(2px);
    pointer-events: none;
  }

  .brand > * { position: relative; z-index: 1; }

  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-mark {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(145deg, #f0945f, var(--clay-500) 60%, var(--clay-700));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px -6px rgba(0,0,0,.4);
    display: grid;
    place-items: center;
    flex: none;
  }
  .logo-mark svg { width: 24px; height: 24px; }

  .logo-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .logo-name small {
    display: block;
    font-size: 11px;
    font-weight: 400;
    opacity: .65;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .brand-body h1 {
    font-size: clamp(30px, 3.4vw, 42px);
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: .5px;
    max-width: 15em;
  }
  .brand-body h1 em {
    font-style: normal;
    color: #ffcf9e;
  }
  .brand-body p {
    margin-top: 18px;
    font-size: 15.5px;
    line-height: 1.9;
    color: rgba(255,240,228,.78);
    max-width: 26em;
  }

  .quote {
    margin-top: 44px;
    padding: 22px 26px;
    border-left: 3px solid #ffab72;
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(6px);
    border-radius: 0 12px 12px 0;
    max-width: 30em;
  }
  .quote p { font-size: 14.5px; line-height: 1.8; margin: 0; color: rgba(255,244,235,.92); }
  .quote .who { margin-top: 12px; font-size: 13px; color: rgba(255,240,228,.6); }

  .brand-foot {
    font-size: 12.5px;
    color: rgba(255,240,228,.45);
    letter-spacing: .5px;
  }

  /* ========== 表单侧 ========== */
  .panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px;
    position: relative;
  }

  .panel-head {
    position: absolute;
    top: 28px; right: 40px;
    font-size: 14px;
    color: var(--ink-400);
  }
  .panel-head a { color: var(--clay-600); text-decoration: none; font-weight: 600; margin-left: 6px; }
  .panel-head a:hover { color: var(--clay-700); }

  .form-wrap { width: 100%; max-width: 396px; margin: 0 auto; }

  form h2 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .3px;
  }
  form .sub {
    margin-top: 8px;
    font-size: 14.5px;
    color: var(--ink-400);
  }

  .field { margin-top: 26px; }

  .field label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-600);
    margin-bottom: 8px;
  }

  .control {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 0 14px;
    height: 48px;
    transition: border-color .18s, box-shadow .18s;
  }
  .control:focus-within {
    border-color: var(--clay-500);
    box-shadow: 0 0 0 3.5px rgba(217,108,63,.16);
  }
  .control svg { width: 18px; height: 18px; color: var(--ink-400); flex: none; }
  .control input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 15px;
    color: var(--ink-900);
    min-width: 0;
  }
  .control input::placeholder { color: #b8ada5; }

  .toggle-pw {
    border: 0;
    background: transparent;
    cursor: pointer;
    color: var(--ink-400);
    display: grid;
    place-items: center;
    padding: 4px;
    border-radius: 6px;
  }
  .toggle-pw:hover { color: var(--clay-600); background: var(--clay-50); }

  .hint {
    display: none;
    margin-top: 7px;
    font-size: 12.5px;
    color: var(--err);
  }
  .field.invalid .hint { display: flex; align-items: center; gap: 5px; }
  .field.invalid .control { border-color: var(--err); }
  .field.invalid .control:focus-within { box-shadow: 0 0 0 3.5px rgba(214,69,69,.12); }

  .row-between {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
  }

  .checkbox {
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    color: var(--ink-600);
    user-select: none;
  }
  .checkbox input {
    appearance: none;
    width: 17px; height: 17px;
    border: 1.5px solid #d8cbc1;
    border-radius: 5px;
    cursor: pointer;
    position: relative;
    transition: background .15s, border-color .15s;
    flex: none;
  }
  .checkbox input:checked {
    background: var(--clay-500);
    border-color: var(--clay-500);
  }
  .checkbox input:checked::after {
    content: "";
    position: absolute;
    left: 5px; top: 1.5px;
    width: 4px; height: 8.5px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(43deg);
  }
  .checkbox input:focus-visible { outline: 2px solid var(--clay-300); outline-offset: 2px; }

  .link {
    color: var(--clay-600);
    text-decoration: none;
    font-weight: 600;
  }
  .link:hover { color: var(--clay-700); text-decoration: underline; }

  .submit {
    margin-top: 28px;
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #e07946, var(--clay-500) 55%, var(--clay-600));
    color: #fff;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow: 0 10px 24px -8px rgba(217,108,63,.55), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s, box-shadow .15s, filter .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .submit:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -8px rgba(217,108,63,.6); }
  .submit:active { transform: translateY(0); }
  .submit[disabled] { filter: saturate(.45) brightness(.96); cursor: default; transform: none; }

  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .submit.loading .spinner { display: block; }

  .divider {
    margin: 30px 0 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--ink-400);
    font-size: 12.5px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .oauth { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .oauth button {
    height: 46px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 13.5px;
    color: var(--ink-600);
    transition: border-color .15s, background .15s, transform .15s;
  }
  .oauth button:hover { border-color: var(--clay-300); background: var(--clay-50); transform: translateY(-1px); }
  .oauth svg { width: 20px; height: 20px; }

  .foot {
    margin-top: 40px;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-400);
  }
  .foot a { color: var(--ink-400); text-decoration: none; }
  .foot a:hover { color: var(--clay-600); }

  /* Toast */
  .toast {
    position: fixed;
    top: 28px;
    left: 50%;
    margin-left: 120px; /* 大致偏到表单侧 */
    transform: translateY(-16px);
    background: var(--clay-900);
    color: #ffe9d8;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    box-shadow: var(--shadow-md);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .toast.error .dot { background: #ff8a8a; }

  /* 动效入场 */
  .fade-up { animation: fadeUp .6s cubic-bezier(.22,.8,.36,1) both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; }
  .d3 { animation-delay: .24s; } .d4 { animation-delay: .32s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* 响应式 */
  @media (max-width: 1040px) {
    .brand { padding: 44px 40px; }
  }
  @media (max-width: 900px) {
    .page { grid-template-columns: 1fr; }
    .brand { min-height: 300px; padding: 40px 36px; }
    .quote, .brand-foot { display: none; }
    .brand-body p { margin-top: 12px; font-size: 14px; }
    .panel { padding: 40px 24px 56px; justify-content: flex-start; }
    .panel-head { position: static; text-align: right; margin-bottom: 20px; }
    .toast { left: 50%; margin-left: 0; transform: translate(-50%, -16px); }
    .toast.show { transform: translate(-50%, 0); }
  }
</style>
</head>
<body>

<div class="page">

  <!-- 左侧品牌区 -->
  <aside class="brand">
    <div class="logo fade-up">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c1.6 2.2 2.4 4.4 2.2 6.8-.2 2.3-1.3 4.2-2.2 5.2-.9-1-2-2.9-2.2-5.2C9.6 7.4 10.4 5.2 12 3z" fill="#fff" stroke="none" opacity=".95"/>
          <path d="M5 11c2.6 1 4.4 2.8 5.3 5.2.8 2.2.6 4.2 0 5.8-1.9-.7-3.8-2-5-4-1.2-2.1-1.4-4.6-.3-7z" fill="#fff" stroke="none" opacity=".7"/>
          <path d="M19 11c-2.6 1-4.4 2.8-5.3 5.2-.8 2.2-.6 4.2 0 5.8 1.9-.7 3.8-2 5-4 1.2-2.1 1.4-4.6.3-7z" fill="#fff" stroke="none" opacity=".7"/>
        </svg>
      </div>
      <div class="logo-name">炽薪云<small>CHIXIN CLOUD</small></div>
    </div>

    <div class="brand-body">
      <h1 class="fade-up d1">让每一次业务决策，<br>都<em>快人一步</em></h1>
      <p class="fade-up d2">炽薪云 SaaS 管理平台为客户提供从数据洞察、流程协同到智能运营的一体化解决方案，助力 20,000+ 企业实现数字化增长。</p>

      <blockquote class="quote fade-up d3">
        <p>"接入炽薪云后，我们的跨部门协作效率提升了近 40%，报表从半人工变成了一键自动。"</p>
        <div class="who">—— 某零售集团 数字化负责人 王经理</div>
      </blockquote>
    </div>

    <div class="brand-foot">© 2026 炽薪云科技 · 沪ICP备00000000号</div>
  </aside>

  <!-- 右侧登录区 -->
  <main class="panel">
    <div class="panel-head">还没有账号？<a href="#" onclick="return false">立即注册</a></div>

    <div class="form-wrap">
      <form id="loginForm" novalidate>
        <h2 class="fade-up">欢迎回来 👋</h2>
        <p class="sub fade-up">登录你的账号，继续今天的工作</p>

        <div class="field fade-up d1" id="fAccount">
          <label for="account">邮箱 / 手机号</label>
          <div class="control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 8 9 5 9-5"/>
            </svg>
            <input id="account" name="account" type="text" placeholder="you@company.com" autocomplete="username" required>
          </div>
          <div class="hint" id="hintAccount"></div>
        </div>

        <div class="field fade-up d1" id="fPassword">
          <label for="password">密码</label>
          <div class="control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="显示或隐藏密码" title="显示 / 隐藏密码">
              <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
              </svg>
              <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><path d="M4 4l16 16"/>
              </svg>
            </button>
          </div>
          <div class="hint" id="hintPassword"></div>
        </div>

        <div class="row-between fade-up d2">
          <label class="checkbox">
            <input type="checkbox" id="remember" checked>
            记住我（30 天）
          </label>
          <a href="#" class="link" onclick="return false">忘记密码？</a>
        </div>

        <button type="submit" class="submit fade-up d2" id="submitBtn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">登 录</span>
        </button>

        <div class="divider fade-up d3">其他方式登录</div>

        <div class="oauth fade-up d3">
          <button type="button" title="使用微信登录" onclick="toast('微信扫码登录开发中','error')">
            <svg viewBox="0 0 24 24" fill="#2aae67"><path d="M9 4C5.13 4 2 6.69 2 10c0 1.9 1.06 3.58 2.7 4.66l-.68 2.05 2.37-1.19c.8.24 1.68.38 2.61.38.2 0 .4-.01.6-.02A6.2 6.2 0 0 1 9.3 13.7c0-3.31 3.13-6 7-6 .2 0 .4 0 .6.02C16.2 5.5 12.9 4 9 4zm11.7 10c0-2.76-2.9-5-6.5-5s-6.5 2.24-6.5 5 2.9 5 6.5 5c.8 0 1.57-.1 2.28-.3l2.02 1.02-.6-1.8C19.05 17.05 20.7 15.6 20.7 14z"/></svg>
            微信
          </button>
          <button type="button" title="使用企业微信登录" onclick="toast('企业微信登录开发中','error')">
            <svg viewBox="0 0 24 24" fill="#3b82d6"><path d="M12 2a10 10 0 0 0-8.94 14.47L2 22l5.72-1.85A10 10 0 1 0 12 2zM8.5 13a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm7 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6z"/></svg>
            飞书
          </button>
          <button type="button" title="使用钉钉登录" onclick="toast('钉钉登录开发中','error')">
            <svg viewBox="0 0 24 24" fill="#4a9cf5"><path d="M12.7 3.2l-1.5 4 2.5-.6c1.2 2.1 1.7 4 1.3 5.6l-3.2-.9 5.6 6.1c-.3 1-1 2-2.1 2.6-1.4.7-2.9.4-3.4-.6l-.9-2.1-2 2.9c-1 .1-2.2-.3-3-1.2-1.5-1.7-1.2-4 .5-5.8l3.6 1-1.7-2.6c.2-2.2 2-4.9 4.3-6.8v-1.6z"/></svg>
            钉钉
          </button>
        </div>
      </form>

      <div class="foot fade-up d4">
        登录即代表同意 <a href="#" onclick="return false">《服务协议》</a> 与 <a href="#" onclick="return false">《隐私政策》</a>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var account = document.getElementById('account');
  var password = document.getElementById('password');
  var fAccount = document.getElementById('fAccount');
  var fPassword = document.getElementById('fPassword');
  var hintAccount = document.getElementById('hintAccount');
  var hintPassword = document.getElementById('hintPassword');
  var btn = document.getElementById('submitBtn');

  // 显示 / 隐藏密码
  var toggle = document.getElementById('togglePw');
  var eyeOpen = document.getElementById('eyeOpen');
  var eyeClosed = document.getElementById('eyeClosed');
  toggle.addEventListener('click', function () {
    var show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    eyeOpen.style.display = show ? 'none' : '';
    eyeClosed.style.display = show ? '' : 'none';
    password.focus();
  });

  // 输入时清除错误态
  account.addEventListener('input', function () {
    fAccount.classList.remove('invalid');
  });
  password.addEventListener('input', function () {
    fPassword.classList.remove('invalid');
  });

  function setError(field, hintEl, msg) {
    field.classList.add('invalid');
    hintEl.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.6" r="1" fill="currentColor" stroke="none"/></svg>' + '<span>' + msg + '</span>';
  }

  var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var phoneRe = /^1[3-9]\d{9}$/;

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = true;

    var v = account.value.trim();
    if (!v) {
      setError(fAccount, hintAccount, '请输入邮箱或手机号');
      ok = false;
    } else if (!emailRe.test(v) && !phoneRe.test(v)) {
      setError(fAccount, hintAccount, '邮箱或手机号格式不正确');
      ok = false;
    }

    if (!password.value) {
      setError(fPassword, hintPassword, '请输入密码');
      ok = false;
    } else if (password.value.length < 6) {
      setError(fPassword, hintPassword, '密码至少 6 位');
      ok = false;
    }

    if (!ok) {
      toast('请先修正表单中的错误', 'error');
      var firstBad = document.querySelector('.field.invalid input');
      if (firstBad) firstBad.focus();
      return;
    }

    // 模拟提交
    btn.disabled = true;
    btn.classList.add('loading');
    btn.querySelector('.label').textContent = '正在登录…';

    setTimeout(function () {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.querySelector('.label').textContent = '登 录';
      toast('登录成功，正在进入控制台…');
    }, 1400);
  });

  // Toast
  var toastEl = document.getElementById('toast');
  var toastMsg = document.getElementById('toastMsg');
  var timer = null;
  window.toast = function (msg, type) {
    toastMsg.textContent = msg;
    toastEl.classList.toggle('error', type === 'error');
    toastEl.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  };
})();
</script>
</body>
</html>
