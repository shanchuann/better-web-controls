<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林一舟 · 个人作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f1;
    --ink: #17140f;
    --ink-soft: #6b6459;
    --line: rgba(23, 20, 15, 0.12);
    --accent: #a2552e;
    --accent-dark: #7c3f21;
    --radius: 999px;
    --font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    --font-sans: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  ::selection { background: var(--accent); color: #fff; }

  a { color: inherit; text-decoration: none; }

  /* ---------- 导航栏 ---------- */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    transition: background .35s ease, box-shadow .35s ease, border-color .35s ease;
    border-bottom: 1px solid transparent;
  }
  .nav.scrolled {
    background: rgba(247, 245, 241, 0.82);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    backdrop-filter: saturate(1.4) blur(14px);
    border-bottom-color: var(--line);
  }
  .nav-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 32px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav.scrolled .nav-inner { height: 64px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.02em;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font-sans);
    letter-spacing: 0.05em;
    transition: transform .4s cubic-bezier(.22,1,.36,1), background .3s;
  }
  .brand:hover .brand-mark {
    transform: rotate(-8deg) scale(1.06);
    background: var(--accent);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 34px;
    list-style: none;
  }
  .nav-link {
    position: relative;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    padding: 6px 0;
    transition: color .25s;
  }
  .nav-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1.5px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform .35s cubic-bezier(.22,1,.36,1);
  }
  .nav-link:hover { color: var(--ink); }
  .nav-link:hover::after {
    transform: scaleX(1);
    transform-origin: left;
  }
  .nav-link.active { color: var(--ink); }

  .nav-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: var(--radius);
    background: var(--ink);
    color: var(--bg);
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.03em;
    border: 1px solid var(--ink);
    transition: background .3s, color .3s, transform .3s;
  }
  .nav-cta:hover {
    background: transparent;
    color: var(--ink);
    transform: translateY(-1px);
  }

  /* 汉堡按钮（仅移动端） */
  .nav-toggle {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 40px;
    height: 40px;
    padding: 8px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  .nav-toggle span {
    display: block;
    height: 1.5px;
    background: var(--ink);
    border-radius: 2px;
    transition: transform .3s, opacity .3s;
  }
  .nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2) { opacity: 0; }
  .nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

  /* ---------- 首屏 ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .hero-glow {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(10px);
  }
  .hero-glow.one {
    width: 560px; height: 560px;
    right: -140px; top: -180px;
    background: radial-gradient(circle, rgba(162, 85, 46, 0.14), transparent 65%);
  }
  .hero-glow.two {
    width: 420px; height: 420px;
    left: -120px; bottom: -160px;
    background: radial-gradient(circle, rgba(23, 20, 15, 0.08), transparent 65%);
  }

  .hero-inner {
    position: relative;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 32px;
    width: 100%;
  }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .hero-eyebrow::before {
    content: "";
    width: 36px;
    height: 1px;
    background: var(--accent);
  }

  .hero-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: clamp(44px, 7vw, 88px);
    line-height: 1.14;
    letter-spacing: 0.01em;
    max-width: 15em;
  }
  .hero-title em {
    font-style: normal;
    color: var(--accent);
    position: relative;
    white-space: nowrap;
  }
  .hero-title em::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0.06em;
    height: 0.32em;
    background: rgba(162, 85, 46, 0.14);
    z-index: -1;
  }

  .hero-sub {
    margin-top: 26px;
    font-size: clamp(15px, 1.8vw, 17px);
    color: var(--ink-soft);
    max-width: 34em;
  }

  .hero-actions {
    margin-top: 42px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 32px;
    border-radius: var(--radius);
    background: var(--ink);
    color: var(--bg);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.03em;
    transition: background .3s, transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s;
  }
  .btn-primary:hover {
    background: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px -10px rgba(162, 85, 46, 0.5);
  }
  .btn-primary svg { transition: transform .3s; }
  .btn-primary:hover svg { transform: translateX(4px); }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 26px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
    transition: border-color .3s, background .3s;
  }
  .btn-ghost:hover {
    border-color: var(--ink);
    background: rgba(23, 20, 15, 0.04);
  }

  .hero-meta {
    margin-top: 72px;
    display: flex;
    gap: clamp(32px, 6vw, 72px);
    padding-top: 30px;
    border-top: 1px solid var(--line);
    max-width: 640px;
  }
  .hero-meta .num {
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
  }
  .hero-meta .label {
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }

  .scroll-cue {
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--ink-soft);
  }
  .scroll-cue .line {
    width: 1px;
    height: 42px;
    background: linear-gradient(var(--ink), transparent);
    animation: drop 2s ease-in-out infinite;
    transform-origin: top;
  }
  @keyframes drop {
    0%   { transform: scaleY(0); opacity: 0; }
    35%  { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(1); opacity: 0; }
  }

  /* 底部锚点占位 */
  .placeholder {
    padding: 120px 32px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 0.08em;
    border-top: 1px solid var(--line);
  }

  /* ---------- 入场动画 ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(26px);
    animation: rise .9s cubic-bezier(.22,1,.36,1) forwards;
  }
  .reveal.d1 { animation-delay: .05s; }
  .reveal.d2 { animation-delay: .18s; }
  .reveal.d3 { animation-delay: .32s; }
  .reveal.d4 { animation-delay: .45s; }
  .reveal.d5 { animation-delay: .6s; }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; opacity: 1; transform: none; }
    html { scroll-behavior: auto; }
    .scroll-cue .line { animation: none; opacity: .5; }
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 820px) {
    .nav-toggle { display: flex; }
    .nav-links {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      background: rgba(247, 245, 241, 0.97);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      max-height: 0;
      overflow: hidden;
      transition: max-height .4s cubic-bezier(.22,1,.36,1);
    }
    .nav-links.open { max-height: 320px; }
    .nav-link {
      padding: 16px 32px;
      border-top: 1px solid var(--line);
      font-size: 15px;
    }
    .nav-link::after { display: none; }
    .nav-cta { margin-right: 12px; }
    .hero { min-height: 92vh; }
    .hero-meta { margin-top: 48px; flex-wrap: wrap; gap: 28px; }
    .scroll-cue { display: none; }
  }
</style>
</head>
<body>

<!-- 导航栏 -->
<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="#top" aria-label="回到顶部">
      <span class="brand-mark" aria-hidden="true">YZ</span>
      林一舟
    </a>

    <nav aria-label="主导航">
      <ul class="nav-links" id="navLinks">
        <li><a class="nav-link active" href="#works">作品</a></li>
        <li><a class="nav-link" href="#about">关于</a></li>
        <li><a class="nav-link" href="#blog">随笔</a></li>
        <li><a class="nav-link" href="#contact">联系</a></li>
      </ul>
    </nav>

    <div style="display:flex; align-items:center; gap:12px;">
      <a class="nav-cta" href="#contact">
        合作洽谈
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- 首屏 -->
<main id="top">
  <section class="hero">
    <div class="hero-glow one" aria-hidden="true"></div>
    <div class="hero-glow two" aria-hidden="true"></div>

    <div class="hero-inner">
      <p class="hero-eyebrow reveal">独立设计师 · 交互与品牌</p>

      <h1 class="hero-title reveal d1">
        把复杂留给自己，<br>
        把<em>克制的美</em>交给用户
      </h1>

      <p class="hero-sub reveal d2">
        你好，我是林一舟。八年产品与视觉设计经验，专注数字产品体验、
        品牌视觉与设计系统。相信好的设计不过度表达，只在恰当之处用力。
      </p>

      <div class="hero-actions reveal d3">
        <a class="btn-primary" href="#works">
          浏览作品
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a class="btn-ghost" href="#contact">与我聊聊</a>
      </div>

      <div class="hero-meta reveal d4">
        <div>
          <div class="num">8<span style="font-size:16px; font-weight:400;">&nbsp;年</span></div>
          <div class="label">设计经验</div>
        </div>
        <div>
          <div class="num">60<span style="font-size:16px; font-weight:400;">&nbsp;+</span></div>
          <div class="label">交付项目</div>
        </div>
        <div>
          <div class="num">12</div>
          <div class="label">合作品牌</div>
        </div>
      </div>
    </div>

    <div class="scroll-cue" aria-hidden="true">
      <span>SCROLL</span>
      <span class="line"></span>
    </div>
  </section>

  <section class="placeholder" id="works">—— 作品集内容区（占位） ——</section>
  <section class="placeholder" id="about">—— 关于我（占位） ——</section>
  <section class="placeholder" id="contact">—— 联系方式（占位） ——</section>
</main>

<script>
  (function () {
    var nav = document.getElementById('nav');
    var toggle = document.getElementById('navToggle');
    var links = document.getElementById('navLinks');

    // 滚动后导航栏加深背景、出现分隔线
    function onScroll() {
      nav.classList.toggle('scrolled', window.scrollY > 24);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    // 移动端菜单开合
    toggle.addEventListener('click', function () {
      var open = links.classList.toggle('open');
      toggle.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单');
    });
    links.addEventListener('click', function (e) {
      if (e.target.closest('.nav-link')) {
        links.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    // 当前分区高亮
    var navLinks = Array.prototype.slice.call(document.querySelectorAll('.nav-link'));
    var targets = navLinks
      .map(function (a) { return document.querySelector(a.getAttribute('href')); })
      .filter(Boolean);

    function highlight() {
      var pos = window.scrollY + window.innerHeight * 0.4;
      var current = targets[0];
      targets.forEach(function (t) {
        if (t && t.offsetTop <= pos) current = t;
      });
      navLinks.forEach(function (a) {
        a.classList.toggle('active', current && a.getAttribute('href') === '#' + current.id);
      });
    }
    window.addEventListener('scroll', highlight, { passive: true });
    highlight();
  })();
</script>
</body>
</html>
