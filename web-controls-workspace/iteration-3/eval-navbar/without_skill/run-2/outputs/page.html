<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陈亦白 · 个人作品集</title>
<style>
  :root {
    --bg: #0c0c0e;
    --bg-soft: #141417;
    --text: #f2f2f0;
    --text-dim: #9a9a96;
    --line: rgba(255, 255, 255, 0.08);
    --accent: #c8b48a;
    --nav-h: 68px;
    --font-sans: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    --font-serif: "Songti SC", "SimSun", Georgia, serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--accent); color: #0c0c0e; }

  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--nav-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(24px, 5vw, 64px);
    z-index: 100;
    background: rgba(12, 12, 14, 0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .nav.scrolled {
    border-bottom-color: var(--line);
    background: rgba(12, 12, 14, 0.88);
  }

  .nav-logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 17px;
    letter-spacing: 0.04em;
    font-weight: 600;
  }

  .nav-logo .mark {
    width: 26px;
    height: 26px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--accent);
    align-self: center;
  }

  .nav-logo .sub {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    position: relative;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    padding: 6px 0;
    transition: color 0.25s ease;
  }

  .nav-links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: var(--text);
  }

  .nav-links a:hover::after,
  .nav-links a.active::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  .nav-cta {
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 9px 22px;
    border: 1px solid var(--text-dim);
    border-radius: 999px;
    color: var(--text);
    transition: all 0.3s ease;
  }

  .nav-cta:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .nav-burger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
  }

  .nav-burger span {
    display: block;
    width: 22px;
    height: 1.5px;
    background: var(--text);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: calc(var(--nav-h) + 40px) clamp(24px, 8vw, 120px) 80px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: "";
    position: absolute;
    top: -20%;
    right: -10%;
    width: 55vw;
    height: 55vw;
    max-width: 720px;
    max-height: 720px;
    background: radial-gradient(circle, rgba(200, 180, 138, 0.09) 0%, transparent 65%);
    pointer-events: none;
  }

  .hero-greeting {
    font-size: 14px;
    letter-spacing: 0.3em;
    color: var(--accent);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .hero-greeting::before {
    content: "";
    width: 48px;
    height: 1px;
    background: var(--accent);
    opacity: 0.6;
  }

  .hero-title {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(44px, 7.5vw, 96px);
    line-height: 1.15;
    letter-spacing: 0.02em;
    margin-bottom: 32px;
    max-width: 14em;
  }

  .hero-title em {
    font-style: normal;
    color: var(--accent);
  }

  .hero-desc {
    max-width: 480px;
    font-size: 16px;
    color: var(--text-dim);
    margin-bottom: 48px;
  }

  .hero-actions {
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 34px;
    background: var(--accent);
    color: #0c0c0e;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    border-radius: 999px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(200, 180, 138, 0.25);
  }

  .btn-primary svg { transition: transform 0.25s ease; }
  .btn-primary:hover svg { transform: translateX(4px); }

  .link-quiet {
    font-size: 14px;
    color: var(--text-dim);
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  .link-quiet:hover {
    color: var(--text);
    border-bottom-color: var(--text-dim);
  }

  .hero-footer {
    position: absolute;
    bottom: 36px;
    left: clamp(24px, 8vw, 120px);
    right: clamp(24px, 8vw, 120px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--text-dim);
  }

  .scroll-hint {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .scroll-hint .bar {
    width: 1px;
    height: 32px;
    background: var(--text-dim);
    position: relative;
    overflow: hidden;
  }

  .scroll-hint .bar::after {
    content: "";
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--accent);
    animation: drip 2.2s ease-in-out infinite;
  }

  @keyframes drip {
    0% { top: -100%; }
    60%, 100% { top: 100%; }
  }

  .reveal {
    opacity: 0;
    transform: translateY(24px);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .reveal:nth-child(2) { animation-delay: 0.15s; }
  .reveal:nth-child(3) { animation-delay: 0.3s; }
  .reveal:nth-child(4) { animation-delay: 0.45s; }
  .reveal:nth-child(5) { animation-delay: 0.6s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 820px) {
    .nav-burger { display: flex; }

    .nav-menu {
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: 0;
      background: rgba(12, 12, 14, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      padding: 16px clamp(24px, 5vw, 64px) 32px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transform: translateY(-12px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .nav-menu.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .nav-links {
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }

    .nav-links a {
      display: block;
      width: 100%;
      padding: 14px 0;
      font-size: 15px;
    }

    .nav-desktop-cta { display: none; }

    .hero-footer .meta { display: none; }
  }
</style>
</head>
<body>

<header class="nav" id="nav">
  <a class="nav-logo" href="#top">
    <span class="mark">白</span>
    <span>陈亦白</span>
    <span class="sub">Portfolio</span>
  </a>

  <button class="nav-burger" id="burger" aria-label="打开菜单" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <nav class="nav-menu" id="menu">
    <ul class="nav-links">
      <li><a href="#top" class="active">首页</a></li>
      <li><a href="#works">作品</a></li>
      <li><a href="#about">关于</a></li>
      <li><a href="#contact">联系</a></li>
    </ul>
  </nav>
  <a class="nav-cta nav-desktop-cta" href="#contact">与我合作</a>
</header>

<main class="hero" id="top">
  <p class="hero-greeting reveal">产品设计师 · 独立开发者</p>
  <h1 class="hero-title reveal">以克制的设计，<br>塑造<em>有分寸</em>的数字体验。</h1>
  <p class="hero-desc reveal">你好，我是陈亦白。五年间为品牌与团队设计网页、应用与视觉系统，相信好的设计是删去多余之后剩下的东西。</p>
  <div class="hero-actions reveal">
    <a class="btn-primary" href="#works">浏览作品
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7h11M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="link-quiet" href="#about">了解我 →</a>
  </div>

  <div class="hero-footer">
    <span class="scroll-hint"><span class="bar"></span>向下滚动</span>
    <span class="meta">杭州 · 中国</span>
  </div>
</main>

<script>
  const nav = document.getElementById('nav');
  const burger = document.getElementById('burger');
  const menu = document.getElementById('menu');

  const onScroll = () => {
    nav.classList.toggle('scrolled', window.scrollY > 24);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  burger.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    burger.setAttribute('aria-expanded', open);
  });

  menu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      menu.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
    });
  });
</script>

</body>
</html>
