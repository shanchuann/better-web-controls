<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户设置</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e4e7ec;
    --text: #1f2329;
    --text-2: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --success-border: #bbf7d0;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .page-desc { color: var(--text-2); margin-bottom: 28px; }

  /* 表单分区：同一填写任务 → 逻辑分组，标签 + 说明成对 */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .section-desc { color: var(--text-2); font-size: 13px; margin-bottom: 20px; }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-weight: 500; margin-bottom: 6px; }
  .required::after {
    content: " *";
    color: #dc2626;
  }
  .hint {
    color: var(--text-2);
    font-size: 12px;
    margin-top: 5px;
  }
  input[type="text"], input[type="email"] {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
  }

  /* 开关行 */
  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
  }
  .switch-row + .switch-row { border-top: 1px dashed var(--border); }
  .switch-label { font-weight: 500; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0;
    background: #d1d5db; border-radius: 999px;
    transition: background .2s;
  }
  .switch .thumb {
    position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
    transition: transform .2s;
  }
  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked ~ .thumb { transform: translateX(18px); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 3px rgba(37,99,235,.15); }

  /* 底栏：保存按钮 */
  .footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 8px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    border-radius: 8px;
    padding: 9px 22px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .15s, color .15s, transform .1s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: .6; cursor: default; transform: none; }
  .btn-primary.saved { background: var(--success); }

  /* ===== 轻提示 Toast ===== */
  .toast-wrap {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
    pointer-events: none;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--success-bg);
    border: 1px solid var(--success-border);
    color: #15803d;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    pointer-events: auto;
    animation: toast-in .25s ease-out;
  }
  .toast svg { flex: none; }
  .toast.leave { animation: toast-out .25s ease-in forwards; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes toast-out {
    to { opacity: 0; transform: translateY(-8px); }
  }
</style>
</head>
<body>
  <div class="page">
    <h1>账户设置</h1>
    <p class="page-desc">修改后点击右下角的"保存设置"即可生效。</p>

    <div class="section">
      <div class="section-title">基本信息</div>
      <div class="section-desc">用于团队内展示的公开信息。</div>
      <div class="field">
        <label for="nickname" class="required">昵称</label>
        <input type="text" id="nickname" value="林一">
        <div class="hint">将显示在你的评论与个人主页。</div>
      </div>
      <div class="field">
        <label for="email" class="required">邮箱</label>
        <input type="email" id="email" value="yilin@example.com">
        <div class="hint">用于接收系统通知，修改后需验证。</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">通知偏好</div>
      <div class="section-desc">可随时在设置中更改，立即生效。</div>
      <div class="switch-row">
        <span class="switch-label">评论回复提醒</span>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="track"></span>
          <span class="thumb"></span>
        </label>
      </div>
      <div class="switch-row">
        <span class="switch-label">每周使用摘要</span>
        <label class="switch">
          <input type="checkbox">
          <span class="track"></span>
          <span class="thumb"></span>
        </label>
      </div>
    </div>

    <div class="footer">
      <button class="btn-primary" id="saveBtn" type="button">保存设置</button>
    </div>
  </div>

  <!-- Toast 挂载点 -->
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <script>
    const SYMBOL = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none">'
      + '<circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>'
      + '<path d="M5 8.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.5" '
      + 'stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';

    const wrap = document.getElementById('toastWrap');
    const btn = document.getElementById('saveBtn');
    let savedTimer = null;

    function toast(message) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = SYMBOL + '<span>' + message + '</span>';
      wrap.appendChild(el);

      // 约 2.5 秒后自动消失，不打断操作
      setTimeout(() => {
        el.classList.add('leave');
        el.addEventListener('animationend', () => el.remove());
      }, 2500);
    }

    btn.addEventListener('click', () => {
      toast('设置已保存');
      btn.textContent = '已保存';
      btn.disabled = true;
      clearTimeout(savedTimer);
      savedTimer = setTimeout(() => {
        btn.textContent = '保存设置';
        btn.disabled = false;
      }, 2500);
    });
  </script>
</body>
</html>
