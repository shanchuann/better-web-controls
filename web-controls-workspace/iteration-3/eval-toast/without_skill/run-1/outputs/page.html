<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
  }

  .settings-page {
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px 80px;
  }

  .settings-header h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .settings-header p {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 24px;
  }

  .settings-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 16px 20px;
    border-bottom: 1px solid #f3f4f6;
  }

  .setting-row:last-child { border-bottom: none; }

  .setting-label { font-size: 14px; font-weight: 500; }
  .setting-desc { font-size: 12px; color: #9ca3af; margin-top: 2px; }

  .setting-control input[type="text"] {
    font-size: 14px;
    padding: 8px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    width: 200px;
    outline: none;
    transition: border-color .15s;
  }

  .setting-control input[type="text"]:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
  }

  .switch {
    position: relative;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .switch .track {
    position: absolute;
    inset: 0;
    background: #d1d5db;
    border-radius: 999px;
    transition: background .2s;
  }

  .switch .thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    transition: transform .2s;
  }

  .switch input:checked + .track { background: #2563eb; }
  .switch input:checked + .track .thumb { transform: translateX(20px); }

  .settings-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 20px;
  }

  .btn {
    font-size: 14px;
    padding: 9px 20px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    background: #fff;
    cursor: pointer;
    transition: background .15s;
  }

  .btn:hover { background: #f9fafb; }

  .btn-primary {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }

  .btn-primary:hover { background: #1d4ed8; }

  /* ===== Toast：页面右上角滑入，2.5 秒后自动消失，不打断用户操作 ===== */
  #toast-region {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    pointer-events: none;
  }

  .toast {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1f2937;
    color: #fff;
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
    opacity: 0;
    transform: translateX(16px);
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: auto;
  }

  .toast.show { opacity: 1; transform: translateX(0); }

  .toast-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="settings-page">
  <div class="settings-header">
    <h1>设置</h1>
    <p>修改后点击保存以使更改生效。</p>
  </div>

  <div class="settings-card">
    <div class="setting-row">
      <div>
        <div class="setting-label">站点名称</div>
        <div class="setting-desc">显示在浏览器标签页和后台顶部</div>
      </div>
      <div class="setting-control">
        <input type="text" id="siteName" value="我的工作台" aria-label="站点名称">
      </div>
    </div>

    <div class="setting-row">
      <div>
        <div class="setting-label">接收邮件通知</div>
        <div class="setting-desc">有新消息时向你注册的邮箱发送提醒</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="emailNotify" checked aria-label="接收邮件通知">
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>

    <div class="setting-row">
      <div>
        <div class="setting-label">深色模式</div>
        <div class="setting-desc">夜间使用更护眼</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="darkMode" aria-label="深色模式">
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>
  </div>

  <div class="settings-footer">
    <button type="button" class="btn" id="resetBtn">重置</button>
    <button type="button" class="btn btn-primary" id="saveBtn">保存</button>
  </div>
</div>

<!-- Toast 容器：fixed 定位 + pointer-events 管理，不遮挡页面内容 -->
<div id="toast-region" aria-live="polite" role="status"></div>

<script>
(function () {
  var ICON_SUCCESS = '<svg class="toast-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="9" fill="#22c55e"/><path d="M6 10.5l2.5 2.5L14 7.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function showToast(message, duration) {
    var region = document.getElementById('toast-region');
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = ICON_SUCCESS + '<span>' + message + '</span>';
    region.appendChild(toast);

    // 下一帧触发过渡，让动画生效
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        toast.classList.add('show');
      });
    });

    setTimeout(function () {
      toast.classList.remove('show');
      // 与过渡时长一致，结束后移除 DOM，避免堆积
      setTimeout(function () { toast.remove(); }, 300);
    }, duration || 2500);
  }

  var saveBtn = document.getElementById('saveBtn');

  saveBtn.addEventListener('click', function () {
    if (saveBtn.disabled) return;

    // 模拟保存请求
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中…';

    setTimeout(function () {
      saveBtn.disabled = false;
      saveBtn.textContent = '保存';
      showToast('设置已保存');
    }, 600);
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    document.getElementById('siteName').value = '我的工作台';
    document.getElementById('emailNotify').checked = true;
    document.getElementById('darkMode').checked = false;
  });
})();
</script>

</body>
</html>
