<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #1f2329;
    min-height: 100vh;
  }

  .page {
    max-width: 640px;
    margin: 40px auto;
    padding: 0 16px;
  }

  .page h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .card {
    background: #fff;
    border: 1px solid #e5e6eb;
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 13px;
    color: #4e5969;
    margin-bottom: 6px;
  }

  .field input[type="text"],
  .field input[type="email"] {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #d0d3d9;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }

  .field input:focus {
    border-color: #3370ff;
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
  }

  .switch-row span { font-size: 14px; }

  .switch {
    position: relative;
    width: 40px;
    height: 22px;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .switch .track {
    position: absolute;
    inset: 0;
    background: #c9cdd4;
    border-radius: 11px;
    cursor: pointer;
    transition: background .2s;
  }

  .switch .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
  }

  .switch input:checked + .track { background: #3370ff; }
  .switch input:checked + .track::after { transform: translateX(18px); }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 8px;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s;
  }

  .btn:hover { opacity: .85; }

  .btn-primary { background: #3370ff; color: #fff; }

  /* ---- Toast：不打断操作的保存成功反馈 ---- */
  .toast {
    position: fixed;
    left: 50%;
    top: 24px;
    transform: translateX(-50%) translateY(-12px);
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid #e5e6eb;
    box-shadow: 0 6px 20px rgba(31, 35, 41, .12);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 1000;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast .icon {
    width: 18px;
    height: 18px;
    flex: none;
  }

  /* 连续保存时长驻提示的呼吸条 */
  .toast .bar {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 4px;
    height: 2px;
    border-radius: 2px;
    background: #3370ff;
    transform-origin: left;
  }

  .toast.show .bar {
    animation: shrink 3s linear forwards;
  }

  @keyframes shrink {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }
</style>
</head>
<body>
  <div class="page">
    <h1>设置</h1>

    <div class="card">
      <h2>个人信息</h2>
      <div class="field">
        <label for="name">昵称</label>
        <input type="text" id="name" value="张三">
      </div>
      <div class="field">
        <label for="email">邮箱</label>
        <input type="email" id="email" value="zhangsan@example.com">
      </div>
    </div>

    <div class="card">
      <h2>通知偏好</h2>
      <div class="switch-row">
        <span>接收产品更新通知</span>
        <label class="switch">
          <input type="checkbox" id="notify" checked>
          <span class="track"></span>
        </label>
      </div>
      <div class="switch-row">
        <span>接收营销邮件</span>
        <label class="switch">
          <input type="checkbox" id="marketing">
          <span class="track"></span>
        </label>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="saveBtn">保存</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="icon" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" fill="#00b578"/>
      <path d="M8 12.5l2.5 2.5L16 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>保存成功</span>
    <div class="bar" id="toastBar"></div>
  </div>

<script>
  const toast = document.getElementById('toast');
  const toastBar = document.getElementById('toastBar');
  const saveBtn = document.getElementById('saveBtn');
  const TOAST_DURATION = 3000;
  let hideTimer = null;

  function showToast() {
    // 重置进度条动画：强制回流后重新加 class
    toastBar.style.animation = 'none';
    void toastBar.offsetWidth;
    toastBar.style.animation = '';

    toast.classList.remove('show');
    void toast.offsetWidth;
    toast.classList.add('show');

    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => toast.classList.remove('show'), TOAST_DURATION);
  }

  saveBtn.addEventListener('click', () => {
    // 模拟保存请求
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中…';

    setTimeout(() => {
      saveBtn.disabled = false;
      saveBtn.textContent = '保存';
      showToast();
    }, 500);
  });
</script>
</body>
</html>
